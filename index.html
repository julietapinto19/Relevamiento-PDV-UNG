<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot de relevamiento PDV — REL</title>
<meta name="theme-color" content="#0E1A1F">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --teal:#04799b; --teal-lt:#349dc0; --teal-pale:#E4F2F6;
    --ink:#0E1A1F; --paper:#EDF0F1; --card:#fff;
    --steel:#66757C; --line:#D6DCDE; --amber:#B87709; --red:#B3261E; --green:#1E7A55;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;background:var(--card);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}

  .bar{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .bar .mark{width:34px;height:34px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:12px;flex:0 0 auto}
  .bar h1{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .bar .st{font-family:var(--mono);font-size:10px;color:var(--teal-lt);letter-spacing:.08em;text-transform:uppercase}
  .bar .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:#93A4AB;text-align:right;line-height:1.3}
  .bar .cnt b{color:#fff;font-size:15px;display:block}
  .prog{height:3px;background:#22303A;flex:0 0 auto}
  .prog i{display:block;height:100%;background:var(--teal-lt);width:0;transition:width .2s}

  .feed{flex:1 1 auto;overflow-y:auto;padding:18px 16px 8px;background:var(--paper);-webkit-overflow-scrolling:touch}
  .row{display:flex;margin-bottom:10px}
  .row.me{justify-content:flex-end}
  .bub{max-width:84%;padding:9px 13px;font-size:14px;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--teal);white-space:pre-wrap;word-wrap:break-word}
  .row.me .bub{background:var(--ink);color:#fff;border:none;border-right:2px solid var(--teal-lt)}
  .bub.sys{background:transparent;border:none;border-left:2px solid var(--line);color:var(--steel);font-size:12px;font-family:var(--mono)}
  .bub.q{border-left-color:var(--amber)}
  .bub b{font-weight:600}
  .bub .cmd{font-family:var(--mono);font-size:12px;background:var(--teal-pale);color:var(--teal);padding:1px 5px}
  .row.me .bub .cmd{background:rgba(255,255,255,.15);color:#9FD6E8}
  .bub .blk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--amber);display:block;margin-bottom:3px}
  .bub img{display:block;width:100%;max-width:230px;margin-bottom:7px}
  .bub .fno{font-family:var(--mono);font-size:10px;opacity:.65;display:block;margin-bottom:4px;letter-spacing:.08em}
  .bub a.dl{display:inline-block;margin-top:8px;background:var(--teal);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:10px 15px}
  .bub .score{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--teal);display:block;line-height:1.1;margin:2px 0 4px}

  .list{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
  .list button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:none;text-align:left;padding:9px 2px;cursor:pointer;border-bottom:1px solid var(--paper);font-family:inherit}
  .list button:active{background:var(--teal-pale)}
  .list .nom{font-size:13px;color:var(--ink);flex:1;line-height:1.3}
  .list .cant{font-family:var(--mono);font-size:11px;color:var(--teal);white-space:nowrap;font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;background:var(--paper);flex:0 0 auto}
  .chip{font-family:var(--mono);font-size:11px;background:var(--card);border:1px solid var(--line);color:var(--teal);padding:8px 12px;cursor:pointer}
  .chip:active{background:var(--teal-pale)}
  .chip.skip{color:var(--steel)}

  .comp{border-top:1px solid var(--line);background:var(--card);flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom)}
  .stage{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--teal-pale);border-bottom:1px solid var(--line)}
  .stage img{width:40px;height:40px;object-fit:cover;flex:0 0 auto}
  .stage span{font-size:12px;color:var(--teal);font-weight:500}
  .stage button{margin-left:auto;background:none;border:none;color:var(--steel);font-size:18px;cursor:pointer;padding:2px 8px}
  .line{display:flex;align-items:flex-end;gap:8px;padding:9px 10px}
  .line textarea{flex:1;border:1px solid var(--line);background:var(--paper);padding:10px 11px;font-family:var(--sans);font-size:16px;resize:none;max-height:110px;outline:none;border-radius:0}
  .line textarea:focus{border-color:var(--teal)}
  .ico{width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;line-height:1;color:var(--teal)}
  .send{width:42px;height:42px;flex:0 0 auto;border:none;background:var(--teal);color:#fff;font-size:16px;cursor:pointer}
  .send:active{background:var(--ink)}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div class="mark">PDV</div>
    <div><h1>Bot de relevamiento</h1><div class="st">REL · Territorio UNG</div></div>
    <div class="cnt"><b id="c-pdv">0</b>PDV · <span id="c-item">0</span> reg.</div>
  </div>
  <div class="prog"><i id="prog"></i></div>
  <div class="feed" id="feed" role="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div class="comp">
    <div class="stage hidden" id="stage">
      <img id="stage-img" alt="Foto lista para enviar">
      <span id="stage-txt">Escribí el comentario de esta foto</span>
      <button id="stage-kill" aria-label="Descartar foto">×</button>
    </div>
    <div class="line">
      <input type="file" id="file" accept="image/*" multiple capture="environment" class="hidden">
      <button class="ico" id="btn-cam" title="Agregar foto" aria-label="Agregar foto">▣</button>
      <textarea id="inp" rows="1" placeholder="Escribí acá…"></textarea>
      <button class="send" id="btn-send" aria-label="Enviar">→</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var feed = $('feed'), inp = $('inp');
  var visitas = [], cur = null, step = 'pdv', queue = [], chk = null;

  /* ===================== GRILLA ===================== */
  /* Grilla UNG.
     dep  : el ítem solo se pregunta si otro fue respondido con cierto valor
     foto : si la respuesta está en esta lista, el bot pide una foto
     com  : si la respuesta está en esta lista, el bot pide un comentario  */
  var BLOQUES = [
    { cmd:'exhibicion', nombre:'Exhibición', items:[
      {id:'primera', q:'¿Primera posición de góndola?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'edfnabs', q:'EDF NABS (cantidad)', tipo:'num'},
      {id:'edfhid',  q:'EDF Hidratación (cantidad)', tipo:'num'},
      {id:'edfene',  q:'EDF Energía (cantidad)', tipo:'num'},
      {id:'popest',  q:'Estado del material POP', tipo:'chips', op:['Bueno','Regular','Malo'],
                     mal:['Malo','Regular'], foto:['Malo','Regular']}
    ]},
    { cmd:'focos', nombre:'Focos', items:[
      {id:'f3l',     q:'Foco 3L — ¿presente?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'ptc3l',   q:'PTC 3L relevado', tipo:'num', dep:{id:'f3l', val:'Sí'}},
      {id:'f2l',     q:'Foco 2L — ¿presente?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'ptc2l',   q:'PTC 2L relevado', tipo:'num', dep:{id:'f2l', val:'Sí'}},
      {id:'f15l',    q:'Foco 1.5L — ¿presente?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'ptc15l',  q:'PTC 1.5L relevado', tipo:'num', dep:{id:'f15l', val:'Sí'}},
      {id:'fstill',  q:'Foco Still — ¿presente?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'ptcstill',q:'PTC Still 1.5L relevado', tipo:'num', dep:{id:'fstill', val:'Sí'}},
      {id:'find',    q:'Foco Individuales — ¿presente?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'fgtd',    q:'Foco GTD Zero — ¿presente?', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'ptczero', q:'PTC Zero relevado', tipo:'num', dep:{id:'fgtd', val:'Sí'}}
    ]},
    { cmd:'competencia', nombre:'Info competencia', items:[
      {id:'pmanaos', q:'Precio Manaos 2.25L', tipo:'num'},
      {id:'pplacer', q:'Precio Placer 1.5L', tipo:'num'},
      {id:'pccx',    q:'Precio CCX 2L retornable', tipo:'num'}
    ]},
    { cmd:'oportunidades', nombre:'Oportunidades', items:[
      {id:'espacio',  q:'¿Espacio para ampliar exhibición?', tipo:'chips', op:['Sí','No'], com:['Sí']},
      {id:'heladera', q:'¿Posibilidad de colocar heladera?', tipo:'chips', op:['Sí','No'], com:['Sí']},
      {id:'ejeccomp', q:'¿Hay alguna ejecución relevante de la competencia?', tipo:'texto'}
    ]},
    { cmd:'ejecucion', nombre:'Datos de ejecución', items:[
      {id:'planog', q:'Cumplimiento de planograma GÓNDOLA', tipo:'chips', op:['Sí','Parcial','No'],
                    mal:['No','Parcial'], foto:['No','Parcial']},
      {id:'planoe', q:'Cumplimiento de planograma EDF', tipo:'chips', op:['Sí','Parcial','No'],
                    mal:['No','Parcial'], foto:['No','Parcial']},
      {id:'vencid', q:'¿Productos vencidos o próximos a vencer?', tipo:'chips', op:['No','Sí'],
                    mal:['Sí'], com:['Sí']}
    ]},
    { cmd:'programa', nombre:'Programa de Mercado', pm:true, items:[
      {id:'pm1', q:'60% Facing share Gatorade', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'pm2', q:'EDF espejo CCX', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'pm3', q:'35% FS Góndola', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'pm4', q:'1 puntera', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'pm5', q:'2 exhibiciones', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'pm6', q:'30% FS Aguas', tipo:'chips', op:['Sí','No'], mal:['No']},
      {id:'pm7', q:'30% FS Saborizadas', tipo:'chips', op:['Sí','No'], mal:['No']}
    ]},
    { cmd:'observaciones', nombre:'Observaciones', items:[
      {id:'probl',  q:'Problemas detectados', tipo:'texto'},
      {id:'comerc', q:'Comentarios del comerciante', tipo:'texto'}
    ]}
  ];
  // El score de Programa de Mercado se calcula sobre estos cinco criterios.
  // Aguas y Saborizadas se relevan pero no puntúan.
  var PM_IDS = ['pm1','pm2','pm3','pm4','pm5'];

  /* ===================== UI ===================== */
  function bub(html, who, cls){
    var r = document.createElement('div');
    r.className = 'row' + (who==='me' ? ' me' : '');
    r.innerHTML = '<div class="bub' + (cls ? ' '+cls : '') + '">' + html + '</div>';
    feed.appendChild(r); feed.scrollTop = feed.scrollHeight; return r;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function cmd(s){ return '<span class="cmd">'+s+'</span>'; }
  function say(h,c){ return bub(h,'bot',c); }
  function me(h){ return bub(h,'me'); }
  function pad(n){ return n<10 ? '0'+n : ''+n; }

  function chips(list, handler){
    $('chips').innerHTML = (list||[]).map(function(c){
      var sk = /^(saltar|saltar bloque|salir|cancelar)$/.test(c) ? ' skip' : '';
      return '<button class="chip'+sk+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('');
    var bs = $('chips').querySelectorAll('.chip');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick = (function(b){ return function(){
        var v = b.getAttribute('data-c');
        if(handler) return handler(v);
        inp.value = v; submit();
      };})(bs[i]);
    }
  }
  var saveT=null;
  function autosave(){
    if(!cur) return;
    if(saveT) clearTimeout(saveT);
    saveT = setTimeout(function(){
      cur && dbPut(cur).then(function(ok){
        if(!ok) say('No se pudo guardar este PDV en el celular. Cerralo con siguiente o generá el PDF para no perderlo.','sys');
      });
    }, 400);
  }

  function counters(){
    autosave();
    var n=0; for(var i=0;i<visitas.length;i++) n += nreg(visitas[i]);
    if(cur) n += nreg(cur);
    $('c-pdv').textContent = visitas.length + (cur?1:0);
    $('c-item').textContent = n;
    if(!chk) $('prog').style.width='0';
  }
  function nreg(v){ return v.items.length + Object.keys(v.resp||{}).length; }

  /* ===================== Drive ===================== */
  var DRIVE_KEY='relevamiento_drive_url';
  var NOMBRE_KEY='relevamiento_relevador';
  var RELEVADORES=['Julieta','Martin','Fernando'];
  function relevador(){ try{ return localStorage.getItem(NOMBRE_KEY)||''; }catch(e){ return ''; } }
  function setRelevador(n){ try{ localStorage.setItem(NOMBRE_KEY,n); }catch(e){} }
  function driveURL(){ try{ return localStorage.getItem(DRIVE_KEY)||''; }catch(e){ return ''; } }
  function setDriveURL(u){ try{ localStorage.setItem(DRIVE_KEY,u); return true; }catch(e){ return false; } }

  function configurar(txt){
    if(!txt){
      step='config';
      say('<b>Conectar con Drive</b>\nPegá la URL de tu aplicación web de Apps Script.\nTermina en <b>/exec</b>.\n\nEscribí '+cmd('cancelar')+' para salir'+(driveURL()?', o '+cmd('desconectar')+' para borrar la actual.':'.'),'sys');
      chips(driveURL()?['cancelar','desconectar']:['cancelar']);
      return;
    }
    var u=txt.trim();
    if(u.indexOf('https://script.google.com/')!==0 || u.indexOf('/exec')<0){
      say('Esa no parece la URL correcta. Tiene que empezar con https://script.google.com/ y terminar en /exec.','sys');
      return;
    }
    say('Probando la conexión…','sys');
    fetch(u).then(function(r){ return r.json(); }).then(function(d){
      setDriveURL(u); step='pdv';
      say('<b>Drive conectado.</b>\n'+esc(d.mensaje||'')+'\nAl cerrar un recorrido te voy a ofrecer subirlo.');
      chips([]);
    })['catch'](function(){
      setDriveURL(u); step='pdv';
      say('Guardé la URL, pero no pude confirmar la conexión desde acá. Probala igual al cerrar el próximo recorrido.','sys');
      chips([]);
    });
  }

  /** sube un recorrido: PDF + filas de planilla */
  function subirDrive(lista, vendedor, blob, nombre){
    var u=driveURL();
    if(!u) return;
    if(!vendedor){
      var uni={};
      for(var z=0;z<lista.length;z++) if(lista[z].vendedor) uni[lista[z].vendedor]=1;
      var kk=Object.keys(uni);
      vendedor = kk.length===1 ? kk[0] : 'Recorridos completos';
    }
    var el=say('Subiendo a Drive…','sys');
    var fr=new FileReader();
    fr.onload=function(){
      var b64=String(fr.result).split(',')[1];
      var d=new Date();
      var payload={
        vendedor: vendedor||'SIN-VENDEDOR',
        pdfNombre: nombre,
        pdf: b64,
        visitas: lista.map(function(v){
          var f=0, fe=0, qExh={};
          for(var e=0;e<BLOQUES[0].items.length;e++) qExh[BLOQUES[0].items[e].q]=1;
          for(var i=0;i<v.items.length;i++){
            if(v.items[i].t!=='foto') continue;
            f++; if(qExh[v.items[i].ref]) fe++;
          }
          var notas=v.items.filter(function(i){ return i.t==='nota'; }).map(function(i){ return i.text; }).join(' · ');
          var r=JSON.parse(JSON.stringify(v.resp||{}));
          if(notas){ r.probl = r.probl||{val:'',com:''}; r.probl.val = (r.probl.val?r.probl.val+' · ':'')+notas; }
          return {
            id:v.id, pdv:v.pdv, vendedor:v.vendedor, frecuencia:v.frecuencia||'',
            relevadoPor: relevador(),
            fecha: d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
            hora: pad(d.getHours())+':'+pad(d.getMinutes()),
            resp:r, cantFotos:f, fotosExhibicion:fe
          };
        })
      };
      fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res && res.ok){
            el.querySelector('.bub').innerHTML='Subido a Drive · '+res.filas+' PDV en la planilla'+
              (res.pdf?'\n<a class="dl" href="'+res.pdf+'" target="_blank" rel="noopener">Ver PDF en Drive</a>':'');
          } else {
            el.querySelector('.bub').innerHTML='Drive rechazó la subida'+(res&&res.error?': '+esc(res.error):'')+'. El PDF ya está descargado igual.';
          }
        })['catch'](function(){
          el.querySelector('.bub').innerHTML='No pude confirmar la subida (puede haberse guardado igual). Revisá tu carpeta de Drive; el PDF ya lo tenés descargado.';
        });
    };
    fr.readAsDataURL(blob);
  }

  /* ===================== IndexedDB ===================== */
  var DB=null;
  function openDB(){ return new Promise(function(res){
    try{ var r=indexedDB.open('relevamiento_pdv',1);
      r.onupgradeneeded=function(e){ var db=e.target.result;
        if(!db.objectStoreNames.contains('visitas')) db.createObjectStore('visitas',{keyPath:'id'}); };
      r.onsuccess=function(e){ DB=e.target.result; res(true); };
      r.onerror=function(){ res(false); };
    }catch(e){ res(false); } }); }
  function tx(m){ return DB.transaction('visitas',m).objectStore('visitas'); }
  function dbPut(v){ return new Promise(function(res){ if(!DB) return res(false);
    try{ var q=tx('readwrite').put(v); q.onsuccess=function(){res(true)}; q.onerror=function(){res(false)}; }catch(e){res(false)} }); }
  function dbAll(){ return new Promise(function(res){ if(!DB) return res([]);
    try{ var q=tx('readonly').getAll(); q.onsuccess=function(){res(q.result||[])}; q.onerror=function(){res([])}; }catch(e){res([])} }); }
  function dbClear(){ return new Promise(function(res){ if(!DB) return res();
    try{ var q=tx('readwrite').clear(); q.onsuccess=function(){res()}; q.onerror=function(){res()}; }catch(e){res()} }); }

  /* ===================== fotos ===================== */
  $('btn-cam').onclick=function(){ $('file').click(); };
  $('file').onchange=function(e){ var fs=e.target.files; for(var i=0;i<fs.length;i++) readImg(fs[i]); e.target.value=''; };
  function readImg(file){
    if(!file.type || file.type.indexOf('image/')!==0) return;
    var fr=new FileReader();
    fr.onload=function(){ var img=new Image();
      img.onload=function(){
        var s=Math.min(1,1280/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        queue.push({url:c.toDataURL('image/jpeg',.72),w:c.width,h:c.height});
        stage();
      }; img.src=fr.result; };
    fr.readAsDataURL(file);
  }
  function stage(){
    if(!queue.length){ $('stage').className='stage hidden'; inp.placeholder = chk?'Comentario opcional…':'Escribí acá…'; return; }
    $('stage').className='stage';
    $('stage-img').src=queue[0].url;
    $('stage-txt').textContent = queue.length>1
      ? 'Comentario · quedan '+(queue.length-1)+' en cola'
      : (chk ? 'Foto para: '+item().q : 'Escribí el comentario de esta foto');
    inp.placeholder='Qué muestra la foto…';
  }
  $('stage-kill').onclick=function(){ queue.shift(); stage(); };

  /* ===================== entrada ===================== */
  inp.addEventListener('input',function(){ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,110)+'px'; });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); } });
  $('btn-send').onclick=submit;

  function submit(){
    var txt=inp.value.trim();
    if(!txt && !queue.length) return;
    inp.value=''; inp.style.height='auto';

    if(queue.length){
      if(step!=='carga'){ say('Antes necesito el código de PDV. La foto queda en cola.'); return; }
      var f=queue.shift(), n=0;
      for(var i=0;i<cur.items.length;i++) if(cur.items[i].t==='foto') n++;
      var it = chk?item():null;
      me('<span class="fno">F'+pad(n+1)+(it?' · '+esc(it.q):'')+'</span><img src="'+f.url+'" alt="Foto del PDV">'+esc(txt||'Sin comentario'));
      cur.items.push({t:'foto',url:f.url,w:f.w,h:f.h,caption:txt||'',ref:it?it.q:''});
      counters(); stage();
      if(!queue.length){
        if(chk && chk.pend && chk.pend.tipo==='foto'){
          chk.pend=null; say('Foto guardada.','sys'); return next();
        }
        say(chk?'Foto guardada en este ítem. Elegí la respuesta.':'Registrada.');
      }
      return;
    }
    me(esc(txt));
    if(chk) return checkInput(txt);
    handle(txt);
  }

  /* ===================== flujo ===================== */
  function abrirPDV(code){
    code = String(code).trim().toUpperCase();
    cur = { id:idVisita(), pdv:code, vendedor:'', vendedorNom:'', relevadoPor:relevador(), items:[], resp:{}, abierto:true };
    step = 'vendedor'; counters();
    say('<b>PDV '+esc(code)+'</b> abierto. ¿Código de vendedor? (solo números)');
    chips([]);
  }
  function idVisita(){
    var d=new Date();
    return 'V-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
  }

  var FRECUENCIAS = ['Lu','Ju','Luju','Ma','Vi','Mavi','Mi','Sa','Misa'];

  function handle(raw){
    var t=raw.toLowerCase().trim();

    /* --- comandos globales: valen en cualquier paso --- */
    if(/^(ayuda|help|comandos)$/.test(t)) return help();
    if(/^(ver|estado)$/.test(t)) return ver();
    if(/^(configurar|drive|conectar)$/.test(t) && step!=='config') return configurar('');
    if(/^(corregir|arreglar|cambiar)$/.test(t) && step!=='fixdato' && step!=='fixfoto') return corregir();
    if(/^(datos|cabecera)$/.test(t) && step!=='fixdato') return corregir('cabecera');
    if(/^(reabrir|volver a|retomar)$/.test(t)) return corregir();
    if(/^(fotos|foto)$/.test(t) && step!=='fixfoto') return corregir('fotos');
    if(step==='fixfoto'){
      if(/^(cancelar|salir|listo)$/.test(t)){ step='carga'; inp.placeholder='Escribí acá…'; say('Listo.','sys'); menu(); return; }
      if(fotoIdx===null) return say('Tocá primero la foto que querés cambiar.','sys');
      var f=cur.items[fotoIdx];
      if(f && f.t==='foto'){
        var antes=f.caption||'(sin comentario)';
        f.caption=raw.trim(); counters();
        say('Comentario actualizado.\n<i>'+esc(antes)+'</i> → <b>'+esc(f.caption||'(sin comentario)')+'</b>','sys');
      }
      fotoIdx=null; step='carga'; inp.placeholder='Escribí acá…';
      return listarFotos();
    }
    if(step==='fixdato'){
      if(/^(cancelar|salir)$/.test(t)) return fixSalir('Listo, no cambié nada.');
      if(!fixCampo){
        if(/^(c[oó]digo|c[oó]digo pdv|pdv)$/.test(t)) return fixElegir('código PDV');
        if(/^vendedor$/.test(t)) return fixElegir('vendedor');
        if(/^frecuencia$/.test(t)) return fixElegir('frecuencia');
        return say('Elegí una de las opciones.','sys');
      }
      if(!fixPDV) return fixSalir('Se perdió la referencia del PDV. Probá de nuevo.');
      if(fixCampo==='pdv'){
        var np=raw.replace(/^pdv\s*/i,'').trim();
        if(!/^\d+$/.test(np)) return say('El código de PDV es solo números.','sys');
        var ant=fixPDV.v.pdv; fixPDV.v.pdv=np;
        return fixSalir('Código cambiado: <b>'+esc(ant)+'</b> → <b>'+esc(np)+'</b>');
      }
      if(fixCampo==='vendedor'){
        var nv=raw.replace(/^v[-\s]*/i,'').trim();
        if(!/^\d+$/.test(nv)) return say('El código de vendedor es solo números.','sys');
        var antv=fixPDV.v.vendedor; fixPDV.v.vendedor='V-'+nv;
        return fixSalir('Vendedor cambiado: <b>'+esc(antv||'—')+'</b> → <b>'+esc(fixPDV.v.vendedor)+'</b>');
      }
      if(fixCampo==='frecuencia'){
        for(var fi=0;fi<FRECUENCIAS.length;fi++){
          if(FRECUENCIAS[fi].toLowerCase()===t){
            var antf=fixPDV.v.frecuencia; fixPDV.v.frecuencia=FRECUENCIAS[fi];
            return fixSalir('Frecuencia cambiada: <b>'+esc(antf||'—')+'</b> → <b>'+esc(fixPDV.v.frecuencia)+'</b>');
          }
        }
        return say('Elegí una de las opciones.','sys');
      }
    }
    if(/^(nombre|quien soy|yo)$/.test(t) && step!=='nombre'){
      step='nombre';
      say('Ahora figurás como <b>'+esc(relevador()||'(sin definir)')+'</b>.\n¿Quién sos?','sys');
      chips(RELEVADORES.concat(['Otro','cancelar']), elegirRelevador); return;
    }
    if(step==='nombre'){
      if(/^(cancelar|salir)$/.test(t)){
        otroModo=false;
        step= relevador()?'pdv':'nombre';
        if(step==='pdv'){ say('Listo, sigue igual.','sys'); chips([]); }
        else { say('Necesito saber quién sos para poder arrancar.','sys'); chips(RELEVADORES.concat(['Otro']), elegirRelevador); }
        return;
      }
      if(/^otro$/.test(t)) return elegirRelevador('Otro');
      for(var ri=0;ri<RELEVADORES.length;ri++)
        if(RELEVADORES[ri].toLowerCase()===t) return elegirRelevador(RELEVADORES[ri]);

      // escribió un nombre propio
      var nom=raw.trim().replace(/\s+/g,' ');
      if(!otroModo){
        say('No está en la lista. Tocá <b>Otro</b> si querés cargarte con otro nombre.','sys');
        chips(RELEVADORES.concat(['Otro'], relevador()?['cancelar']:[]), elegirRelevador);
        return;
      }
      if(nom.length<3) return say('Escribí tu nombre completo, al menos 3 letras.','sys');
      nom = nom.charAt(0).toUpperCase()+nom.slice(1);
      otroModo=false;
      return guardarRelevador(nom);
    }
    if(/^desconectar$/.test(t) && step!=='config'){ setDriveURL(''); return say('Drive desconectado. Los PDF se siguen generando en el celular.','sys'); }

    if(step==='config'){
      if(/^(cancelar|salir)$/.test(t)){ step='pdv'; say('Listo, nada cambió.','sys'); chips([]); return; }
      return configurar(raw);
    }

    /* cerrar el recorrido funciona siempre, aunque haya un PDV recién abierto */
    if(/^(cerrar|finalizar)$/.test(t)){
      if(cur && !nreg(cur)){
        var vacio=cur.pdv; cur=null; step='pdv'; chk=null; counters();
        say('Descarté el PDV '+esc(vacio)+' porque estaba vacío.','sys');
      }
      return cerrarTodo();
    }

    /* siguiente solo tiene sentido con un PDV abierto */
    if(/^(siguiente|otro pdv|nuevo pdv)$/.test(t)){
      if(!cur) return say('No hay ningún PDV abierto. Escribí el código para abrir uno, o '+cmd('cerrar')+' para terminar el recorrido.','sys');
      if(step!=='carga') return say('Todavía falta completar los datos de este PDV.','sys');
      return cerrarPDV();
    }

    /* --- pasos de apertura --- */
    if(step==='pdv'){
      var code=raw.replace(/^pdv\s*/i,'').trim();
      if(!code) return say('Necesito el código de PDV.');
      if(!/^\d+$/.test(code))
        return say('El código de PDV es solo números. Escribilo sin letras ni guiones — por ejemplo <b>104582</b>.','sys');
      return abrirPDV(code);
    }
    if(step==='vendedor'){
      var v=raw.replace(/^v[-\s]*/i,'').trim();
      if(!/^\d+$/.test(v))
        return say('El código de vendedor es solo números — por ejemplo <b>118</b>.','sys');
      cur.vendedor='V-'+v; step='frecuencia'; counters();
      say('Vendedor <b>'+esc(cur.vendedor)+'</b>. ¿Frecuencia de visita?');
      chips(FRECUENCIAS, function(f){ me(f); setFrecuencia(f); });
      return;
    }
    if(step==='frecuencia'){
      var f=null;
      for(var i=0;i<FRECUENCIAS.length;i++)
        if(FRECUENCIAS[i].toLowerCase()===t) f=FRECUENCIAS[i];
      if(!f) return say('Frecuencia no válida. Elegí una de las opciones: '+FRECUENCIAS.join(' · '),'sys');
      return setFrecuencia(f);
    }

    /* --- carga --- */
    if(/^(deshacer|borrar)$/.test(t)){
      var x=cur.items.pop(); counters();
      return say(x?'Borré el último registro.':'No hay nada para borrar en este PDV.');
    }
    if(/^editar$/.test(t)) return corregir('respuestas');
    if(/^(checklist|check)$/.test(t)) return startCheck(null);
    for(var b=0;b<BLOQUES.length;b++){
      if(t===BLOQUES[b].cmd || t===BLOQUES[b].nombre.toLowerCase()) return startCheck(b);
    }
    cur.items.push({t:'nota',text:raw.trim()}); counters(); say('Anotado.');
  }

  var otroModo=false;
  function elegirRelevador(n){
    if(n==='cancelar'){ me('cancelar'); otroModo=false; return handle('cancelar'); }
    if(n==='Otro'){
      me('Otro'); otroModo=true; step='nombre';
      say('Escribí tu nombre.','sys');
      chips(relevador()?['cancelar']:[]);
      inp.focus();
      return;
    }
    me(n); guardarRelevador(n);
  }
  function guardarRelevador(n){
    setRelevador(n); step='pdv';
    say('Listo, <b>'+esc(n)+'</b>. Vas a figurar en la planilla en cada visita que cargues.\n\nEscribí el <b>código de PDV</b> para empezar.');
    chips([]);
  }

  var fixCampo=null, fixPDV=null;

  /** Lista los PDV del recorrido (abierto + cerrados) para elegir cuál corregir. */
  /* ============ CORREGIR — punto de entrada único ============
     corregir()            -> elige PDV, después qué corregir
     corregir('cabecera')  -> atajo directo (comandos viejos)
  */
  var fixDestino=null;

  function corregir(destino){
    fixDestino = destino || null;
    var lista=[];
    if(cur) lista.push({v:cur, cerrado:false});
    for(var i=visitas.length-1;i>=0;i--) lista.push({v:visitas[i], cerrado:true});
    if(!lista.length) return say('Todavía no cargaste ningún PDV en este recorrido.','sys');

    if(lista.length===1){ fixPDV=lista[0]; return activarYMostrar(); }

    var html='<b>¿Qué PDV querés corregir?</b><div class="list">';
    for(var k=0;k<lista.length;k++){
      var x=lista[k].v;
      html+='<button data-fx="'+k+'"><span class="nom"><b>PDV '+esc(x.pdv)+'</b> · '+esc(x.vendedor||'—')+
            '</span><span class="cant">'+nreg(x)+' reg.</span></button>';
    }
    html+='</div>';
    var el=say(html);
    var bs=el.querySelectorAll('[data-fx]');
    for(var q=0;q<bs.length;q++){
      bs[q].onclick=(function(b){ return function(){
        fixPDV=lista[parseInt(b.getAttribute('data-fx'),10)];
        me('PDV '+fixPDV.v.pdv);
        activarYMostrar();
      };})(bs[q]);
    }
    chips(['cancelar'], function(){ me('cancelar'); fixDestino=null; say('Listo, nada cambié.','sys'); volverAlFlujo(); });
  }

  /** Deja el PDV elegido como el activo (reabriéndolo si estaba cerrado) y muestra qué se puede corregir. */
  function activarYMostrar(){
    var x=fixPDV.v;
    if(fixPDV.cerrado){
      if(cur && nreg(cur)){ var prev=cur; prev.abierto=false; visitas.push(prev); dbPut(prev); }
      var pos=visitas.indexOf(x);
      if(pos>=0) visitas.splice(pos,1);
      x.abierto=true; cur=x; chk=null; dbPut(x);
      fixPDV.cerrado=false;
    }
    step='carga'; counters();
    if(fixDestino==='cabecera'){ fixDestino=null; return abrirFix(); }
    if(fixDestino==='fotos'){ fixDestino=null; return listarFotos(); }
    if(fixDestino==='respuestas'){ fixDestino=null; return editar(); }
    return queCorregir();
  }

  /** Menú de qué se puede corregir del PDV activo. */
  function queCorregir(){
    var x=cur;
    var nResp=Object.keys(x.resp||{}).length, nFotos=0, nNotas=0;
    for(var i=0;i<x.items.length;i++){
      if(x.items[i].t==='foto') nFotos++; else nNotas++;
    }
    var html='<b>PDV '+esc(x.pdv)+'</b> · '+esc(x.vendedor||'—')+' · '+esc(x.frecuencia||'—')+
             '<div class="list">'+
      '<button data-qc="cabecera"><span class="nom"><b>Código, vendedor o frecuencia</b><br>'+
        '<span style="color:var(--steel);font-size:11.5px">PDV '+esc(x.pdv)+' · '+esc(x.vendedor||'—')+' · '+esc(x.frecuencia||'—')+'</span>'+
        '</span><span class="cant">›</span></button>'+
      '<button data-qc="respuestas"><span class="nom"><b>Respuestas del checklist</b><br>'+
        '<span style="color:var(--steel);font-size:11.5px">'+(nResp?nResp+' ítems cargados':'ninguno cargado')+'</span>'+
        '</span><span class="cant">›</span></button>'+
      '<button data-qc="fotos"><span class="nom"><b>Fotos y sus comentarios</b><br>'+
        '<span style="color:var(--steel);font-size:11.5px">'+(nFotos?nFotos+(nFotos===1?' foto':' fotos'):'ninguna')+'</span>'+
        '</span><span class="cant">›</span></button>'+
      (nNotas?'<button data-qc="nota"><span class="nom"><b>Borrar la última nota</b><br>'+
        '<span style="color:var(--steel);font-size:11.5px">'+nNotas+(nNotas===1?' nota':' notas')+'</span>'+
        '</span><span class="cant">›</span></button>':'')+
      '</div>';
    var el=say(html);
    var bs=el.querySelectorAll('[data-qc]');
    for(var q=0;q<bs.length;q++){
      bs[q].onclick=(function(b){ return function(){
        var d=b.getAttribute('data-qc');
        if(d==='cabecera'){ me('Código, vendedor o frecuencia'); return abrirFix(); }
        if(d==='respuestas'){ me('Respuestas del checklist'); return editar(); }
        if(d==='fotos'){ me('Fotos'); return listarFotos(); }
        if(d==='nota'){
          me('Borrar la última nota');
          for(var i=cur.items.length-1;i>=0;i--){
            if(cur.items[i].t==='nota'){
              var txt=cur.items[i].text; cur.items.splice(i,1); counters(); dbPut(cur);
              say('Nota borrada: <i>'+esc(txt)+'</i>','sys'); break;
            }
          }
          return queCorregir();
        }
      };})(bs[q]);
    }
    chips(['listo'], function(){ me('listo'); volverAlFlujo(); });
  }


  function abrirFix(){
    var x=fixPDV.v;
    step='fixdato'; fixCampo=null;
    say('<b>PDV '+esc(x.pdv)+'</b>'+(fixPDV.cerrado?' (ya cerrado)':'')+
        '\nVendedor: <b>'+esc(x.vendedor||'—')+'</b>\nFrecuencia: <b>'+esc(x.frecuencia||'—')+'</b>\n\n¿Qué querés cambiar?','sys');
    chips(['código PDV','vendedor','frecuencia','cancelar'], fixElegir);
  }

  function fixElegir(c){
    if(c==='cancelar'){ me('cancelar'); return fixSalir('Listo, no cambié nada.'); }
    me(c);
    if(c==='código PDV'){ fixCampo='pdv'; say('Escribí el código correcto (solo números).','sys'); chips(['cancelar'], fixElegir); }
    else if(c==='vendedor'){ fixCampo='vendedor'; say('Escribí el código de vendedor (solo números).','sys'); chips(['cancelar'], fixElegir); }
    else if(c==='frecuencia'){
      fixCampo='frecuencia'; say('¿Frecuencia?','sys');
      chips(FRECUENCIAS.concat(['cancelar']), function(v){
        if(v==='cancelar') return fixElegir('cancelar');
        me(v); var ant=fixPDV.v.frecuencia; fixPDV.v.frecuencia=v;
        fixSalir('Frecuencia cambiada: <b>'+esc(ant||'—')+'</b> → <b>'+esc(v)+'</b>');
      });
    }
    inp.focus();
  }

  function fixSalir(msg){
    var x = fixPDV ? fixPDV.v : null;
    var cerrado = fixPDV ? fixPDV.cerrado : false;
    fixCampo=null;
    counters();
    say(msg,'sys');
    if(x){
      if(cerrado) dbPut(x);
      say('PDV <b>'+esc(x.pdv)+'</b> · vendedor <b>'+esc(x.vendedor||'—')+'</b> · visita <b>'+esc(x.frecuencia||'—')+'</b>'+
          (cerrado?'\n<i>Corregido en el PDV ya cerrado.</i>':''));
    }
    fixPDV=null;
    if(cur) queCorregir(); else volverAlFlujo();
  }

  function volverAlFlujo(){
    fixCampo=null; fixPDV=null;
    inp.placeholder='Escribí acá…';
    if(cur){ step='carga'; menu(); }
    else { step='pdv'; say('¿Código del próximo PDV?'); chips(['cerrar']); }
  }

  function setFrecuencia(f){
    cur.frecuencia=f; step='carga'; counters();
    say('Frecuencia <b>'+esc(f)+'</b>. Listo para cargar.\nMandá fotos con su comentario o escribí notas sueltas.\nPara el relevamiento en detalle, tocá '+cmd('checklist')+'.');
    menu();
  }

  function menu(){
    inp.placeholder='Escribí acá…';
    chips(['checklist','corregir','siguiente','cerrar']);
  }

  function help(){
    say('<b>LOS QUE USÁS SIEMPRE</b>\n'+
        cmd('checklist')+' — relevar el PDV en detalle\n'+
        cmd('corregir')+' — arreglar cualquier cosa de cualquier PDV del recorrido\n'+
        cmd('siguiente')+' — cerrar este PDV y abrir otro\n'+
        cmd('cerrar')+' — terminar el recorrido y generar el PDF\n'+
        '\n<b>MIENTRAS CARGÁS</b>\n'+
        'Un bloque suelto: '+BLOQUES.map(function(b){return b.cmd}).join(' · ')+'\n'+
        cmd('deshacer')+' — borrar el último registro cargado\n'+
        cmd('ver')+' — qué llevás cargado hasta ahora\n'+
        '\n<b>DENTRO DEL CHECKLIST</b>\n'+
        cmd('atrás')+' — volver al ítem anterior\n'+
        cmd('saltar')+' — dejar este ítem sin responder\n'+
        cmd('saltar bloque')+' — saltear el resto del bloque\n'+
        cmd('salir')+' — cortar y volver al menú\n'+
        '\n<b>CONFIGURACIÓN</b>\n'+
        cmd('nombre')+' — quién figura como relevador\n'+
        cmd('configurar')+' — conexión con Drive\n'+
        '\nTodo lo que escribas y no sea un comando queda como <b>nota</b> del PDV.');
  }

  function ver(){
    if(!visitas.length && !cur) return say('Todavía no cargaste nada.');
    var l=visitas.map(function(v){ return '· PDV '+v.pdv+' ('+v.vendedor+') — '+nreg(v)+' reg.'; }).join('\n');
    say('<b>Recorrido</b>\n'+(l||'(sin PDV cerrados)')+(cur?'\n· PDV '+cur.pdv+' — '+nreg(cur)+' reg. (abierto)':''),'sys');
  }

  /* ===================== checklist ===================== */
  // chk = {blocks:[idx], bi, ii, edit:{b,i}|null}
  function curB(){ return chk.edit ? chk.edit.b : chk.blocks[chk.bi]; }
  function curI(){ return chk.edit ? chk.edit.i : chk.ii; }
  function item(){ return BLOQUES[curB()].items[curI()]; }
  function bloque(){ return BLOQUES[curB()]; }
  function totalItems(){ var n=0; for(var i=0;i<chk.blocks.length;i++) n+=BLOQUES[chk.blocks[i]].items.length; return n; }
  function doneItems(){ var n=0; for(var i=0;i<chk.bi;i++) n+=BLOQUES[chk.blocks[i]].items.length; return n+chk.ii; }

  function startCheck(bIdx){
    var list=[];
    if(bIdx===null){ for(var i=0;i<BLOQUES.length;i++) list.push(i); } else list.push(bIdx);
    chk={blocks:list,bi:0,ii:0,edit:null};
    say('<b>'+(bIdx===null?'Checklist completo':BLOQUES[bIdx].nombre)+'</b>\nTocá la respuesta. Podés escribir un comentario antes de tocar, adjuntar foto, o volver con '+cmd('atrás')+'.','sys');
    ask();
  }

  /** ¿corresponde preguntar este ítem? */
  function aplica(it){
    if(!it.dep) return true;
    var r=(cur.resp||{})[it.dep.id];
    return !!(r && r.val===it.dep.val);
  }

  function ask(){
    if(!chk.edit && chk.bi>=chk.blocks.length) return endCheck();
    // saltear los ítems condicionales que no corresponden
    if(!chk.edit){
      var guard=0;
      while(chk.bi<chk.blocks.length && !aplica(item()) && guard++<100){
        var b0=BLOQUES[chk.blocks[chk.bi]];
        chk.ii++;
        if(chk.ii>=b0.items.length){
          if(b0.pm) mostrarScore(cur);
          chk.bi++; chk.ii=0;
        }
      }
      if(chk.bi>=chk.blocks.length) return endCheck();
    }
    var b=bloque(), it=item(), prev=(cur.resp||{})[it.id];
    if(!chk.edit) $('prog').style.width=Math.round(doneItems()/totalItems()*100)+'%';
    say('<span class="blk">'+(chk.edit?'CORRIGIENDO · ':'')+esc(b.nombre.toUpperCase())+' · '+(curI()+1)+'/'+b.items.length+'</span><b>'+esc(it.q)+'</b>'+
        (prev && prev.val ? '\nAhora dice: '+esc(prev.val)+(prev.com?' ('+esc(prev.com)+')':'') : '')+
        (it.tipo==='num'?'\nEscribí el número.':(it.tipo==='texto'?'\nEscribí la respuesta.':'')),'q');
    var ops = (it.tipo==='chips'?it.op.slice():[]);
    if(chk.edit){
      if(prev && (prev.val||prev.com)) ops.push('borrar rta');
      ops.push('cancelar');
    } else {
      if(doneItems()>0) ops.push('atrás');
      ops.push('saltar'); ops.push('saltar bloque');
    }
    chips(ops, chipAnswer);
    inp.placeholder = it.tipo==='chips'?'Comentario opcional…':'Respuesta…';
  }

  /** Después de responder, ¿hay que pedir foto o comentario? Devuelve true si quedó pendiente. */
  function seguimiento(it, val){
    if(chk.edit) return false;
    if(it.foto && it.foto.indexOf(val)>=0){
      chk.pend={tipo:'foto', q:it.q};
      say('Sacá una foto de esto para dejarlo documentado.','sys');
      chips(['sacar foto','seguir sin foto'], function(c){
        if(c==='sacar foto'){ me('sacar foto'); $('file').click(); return; }
        me('seguir sin foto'); chk.pend=null; next();
      });
      return true;
    }
    if(it.com && it.com.indexOf(val)>=0){
      chk.pend={tipo:'coment', q:it.q};
      say('Contame brevemente.','sys');
      inp.placeholder='Escribí el detalle…';
      chips(['seguir sin comentario'], function(){
        me('seguir sin comentario'); chk.pend=null; inp.placeholder='Comentario opcional…'; next();
      });
      inp.focus();
      return true;
    }
    return false;
  }

  function chipAnswer(v){
    if(v==='atrás'){ me('atrás'); return atras(); }
    if(v==='cancelar'){ me('cancelar'); return finEdit('Sin cambios.'); }
    if(v==='borrar rta'){ me('borrar rta'); delete cur.resp[item().id]; counters(); return finEdit('Respuesta borrada.'); }
    if(v==='saltar'){ me('saltar'); return next(); }
    if(v==='saltar bloque'){ me('saltar bloque'); chk.bi++; chk.ii=0; return ask(); }
    me(esc(v));
    var it0=item();
    save(v);
    if(chk.edit) return next();
    if(seguimiento(it0, v)) return;
    next();
  }

  function checkInput(txt){
    var t=txt.toLowerCase().trim();
    if(t==='salir'){ chk=null; $('prog').style.width='0'; say('Salí del checklist. Lo respondido queda guardado.','sys'); menu(); return; }
    if(/^(atras|atrás|volver)$/.test(t)) return atras();
    if(t==='cancelar' && chk.edit) return finEdit('Sin cambios.');
    if(t==='saltar') return next();
    if(t==='saltar bloque'){ if(chk.edit) return finEdit('Sin cambios.'); chk.bi++; chk.ii=0; return ask(); }
    var it=item();

    // había un comentario pendiente pedido por el bot: lo guardo y sigo
    if(chk.pend && chk.pend.tipo==='coment'){
      var rp=cur.resp[it.id]||(cur.resp[it.id]={bloque:bloque().nombre,q:it.q,val:'',com:''});
      rp.com = rp.com ? rp.com+' · '+txt : txt;
      chk.pend=null; inp.placeholder='Comentario opcional…';
      return next();
    }

    if(it.tipo==='chips'){
      var r=cur.resp[it.id]||(cur.resp[it.id]={bloque:bloque().nombre,q:it.q,val:'',com:''});
      // corrigiendo: el comentario nuevo reemplaza al viejo. cargando: se acumula.
      r.com = (chk.edit || !r.com) ? txt : r.com+' · '+txt;
      say(chk.edit?'Comentario reemplazado. Elegí la respuesta.':'Comentario agregado. Ahora elegí la respuesta.','sys'); return;
    }
    save(txt); next();
  }

  function save(val){
    var it=item();
    var r=cur.resp[it.id]||(cur.resp[it.id]={bloque:bloque().nombre,q:it.q,val:'',com:''});
    r.val=val; r.mal=!!(it.mal && it.mal.indexOf(val)>=0);
    counters();
  }

  // volver un item; si estoy al inicio de un bloque, vuelvo al ultimo del anterior
  function atras(){
    if(chk.edit) return finEdit('Sin cambios.');
    if(chk.bi>=chk.blocks.length){ chk.bi=chk.blocks.length-1; chk.ii=BLOQUES[chk.blocks[chk.bi]].items.length-1; return ask(); }
    if(chk.ii>0){ chk.ii--; return ask(); }
    if(chk.bi>0){ chk.bi--; chk.ii=BLOQUES[chk.blocks[chk.bi]].items.length-1; return ask(); }
    say('Ya estás en el primer ítem.','sys'); return ask();
  }

  function next(){
    if(chk.edit) return finEdit('Corregido.');
    var b=bloque();
    chk.ii++;
    if(chk.ii>=b.items.length){
      if(b.pm) mostrarScore(cur);
      chk.bi++; chk.ii=0;
    }
    ask();
  }

  function finEdit(msg){
    if(!chk || !chk.edit){ chk=null; $('prog').style.width='0'; say(msg,'sys'); menu(); return; }
    var vueltaAlChecklist = chk.edit.ret;
    chk.edit=null;
    say(msg,'sys');
    if(vueltaAlChecklist) return ask();
    chk=null; $('prog').style.width='0';
    menu();
  }


  /* -------- editar comentarios de las fotos -------- */
  var fotoIdx=null;
  function listarFotos(){
    if(!cur) return say('No hay ningún PDV abierto. Tocá '+cmd('corregir')+' para elegir uno del recorrido.','sys');
    var fotos=[];
    for(var i=0;i<cur.items.length;i++) if(cur.items[i].t==='foto') fotos.push(i);
    if(!fotos.length) return say('Este PDV todavía no tiene fotos.','sys');
    var html='<b>Fotos del PDV '+esc(cur.pdv)+'</b> — tocá una para cambiar su comentario<div class="list">';
    for(var k=0;k<fotos.length;k++){
      var f=cur.items[fotos[k]];
      html+='<button data-ft="'+fotos[k]+'">'+
            '<img src="'+f.url+'" alt="Foto '+(k+1)+'" style="width:44px;height:44px;object-fit:cover;flex:0 0 auto">'+
            '<span class="nom">'+(f.ref?'<b>'+esc(f.ref)+'</b><br>':'')+esc(f.caption||'(sin comentario)')+'</span>'+
            '<span class="cant">F'+pad(k+1)+'</span></button>';
    }
    html+='</div>';
    var el=say(html);
    var bs=el.querySelectorAll('[data-ft]');
    for(var q=0;q<bs.length;q++){
      bs[q].onclick=(function(b){ return function(){
        fotoIdx=parseInt(b.getAttribute('data-ft'),10);
        var f=cur.items[fotoIdx];
        me('Foto: '+(f.caption||'(sin comentario)'));
        step='fixfoto'; inp.placeholder='Nuevo comentario…';
        say('Escribí el comentario nuevo para esta foto.','sys');
        chips(['borrar foto','cancelar'], function(c){
          if(c==='cancelar'){ me('cancelar'); fotoIdx=null; step='carga'; inp.placeholder='Escribí acá…'; return listarFotos(); }
          me('borrar foto');
          cur.items.splice(fotoIdx,1); fotoIdx=null; step='carga';
          inp.placeholder='Escribí acá…'; counters();
          say('Foto borrada.','sys'); listarFotos();
        });
        inp.focus();
      };})(bs[q]);
    }
    chips(['listo'], function(){ me('listo'); step='carga'; inp.placeholder='Escribí acá…'; menu(); });
  }

  /* -------- corregir una respuesta ya cargada -------- */
  function editar(){
    if(!cur) return say('No hay ningún PDV abierto.');
    var conDatos=[];
    for(var b=0;b<BLOQUES.length;b++){
      var n=0;
      for(var i=0;i<BLOQUES[b].items.length;i++){
        var r=(cur.resp||{})[BLOQUES[b].items[i].id];
        if(r && (r.val||r.com)) n++;
      }
      if(n) conDatos.push([b,n]);
    }
    if(!conDatos.length) return say('Todavía no respondiste ningún ítem en este PDV.');
    var html='<b>¿Qué bloque querés corregir?</b><div class="list">';
    for(var k=0;k<conDatos.length;k++){
      html+='<button data-b="'+conDatos[k][0]+'"><span class="nom">'+esc(BLOQUES[conDatos[k][0]].nombre)+'</span><span class="cant">'+conDatos[k][1]+'</span></button>';
    }
    html+='</div>';
    var el=say(html);
    var bs=el.querySelectorAll('[data-b]');
    for(var q=0;q<bs.length;q++){
      bs[q].onclick=(function(btn){ return function(){
        var b=parseInt(btn.getAttribute('data-b'),10);
        me(BLOQUES[b].nombre); listarItems(b);
      };})(bs[q]);
    }
    chips([]);
  }

  function listarItems(b){
    var B=BLOQUES[b], html='<b>'+esc(B.nombre)+'</b> — tocá el ítem a corregir<div class="list">';
    for(var i=0;i<B.items.length;i++){
      var r=(cur.resp||{})[B.items[i].id];
      var val = r && r.val ? r.val : (r && r.com ? '(solo comentario)' : '—');
      html+='<button data-i="'+i+'"><span class="nom">'+esc(B.items[i].q)+'</span><span class="cant">'+esc(val)+'</span></button>';
    }
    html+='</div>';
    var el=say(html);
    var bs=el.querySelectorAll('[data-i]');
    for(var q=0;q<bs.length;q++){
      bs[q].onclick=(function(btn){ return function(){
        var i=parseInt(btn.getAttribute('data-i'),10);
        me(BLOQUES[b].items[i].q);
        var ret = chk && !chk.edit ? {bi:chk.bi, ii:chk.ii} : null;
        if(!chk) chk={blocks:[b],bi:0,ii:0,edit:null};
        chk.edit={b:b,i:i,ret:ret};
        ask();
      };})(bs[q]);
    }
    chips([]);
  }

  function pmScore(v){
    var si=0, tot=0;
    for(var i=0;i<PM_IDS.length;i++){
      var r=(v.resp||{})[PM_IDS[i]];
      if(r && r.val){ tot++; if(r.val==='Sí') si++; }
    }
    return tot ? {si:si, tot:tot, pct:Math.round(si/tot*100)} : null;
  }
  function mostrarScore(v){
    var s=pmScore(v);
    if(!s) return;
    say('<b>Programa de Mercado</b><span class="score">'+s.pct+'%</span>'+s.si+' de '+s.tot+' criterios cumplidos'+(s.tot<7?' · '+(7-s.tot)+' sin evaluar':''));
  }
  function endCheck(){
    var n=Object.keys(cur.resp).length, mal=0;
    for(var k in cur.resp) if(cur.resp[k].mal) mal++;
    chk=null; $('prog').style.width='0'; inp.placeholder='Escribí acá…';
    say('<b>Checklist terminado.</b>\n'+n+' ítems respondidos'+(mal?' · '+mal+' marcados como problema':'')+'.\nSi algo quedó mal, '+cmd('editar')+'.');
    menu(); counters();
  }

  /* ===================== cierre ===================== */
  function cerrarPDV(){
    if(!nreg(cur)) return say('Este PDV no tiene ningún registro. Cargá algo primero.');
    var v=cur; v.abierto=false; visitas.push(v); cur=null; step='pdv'; chk=null; counters();
    dbPut(v).then(function(ok){
      say('PDV '+esc(v.pdv)+' cerrado'+(ok?' y guardado.':'. Ojo: no se pudo guardar.')+'\n¿Código del próximo PDV?');
    });
    inp.placeholder='Escribí acá…';
    chips(['corregir','cerrar']);
  }
  function cerrarTodo(){
    var p=Promise.resolve();
    if(cur && nreg(cur)){ var v=cur; v.abierto=false; visitas.push(v); cur=null; step='pdv'; chk=null; p=dbPut(v); }
    if(!visitas.length) return say('No hay ningún PDV cargado.');
    counters();
    p.then(function(){
      var vend={};
      for(var i=0;i<visitas.length;i++){ var k=visitas[i].vendedor||'SIN-VEND'; (vend[k]=vend[k]||[]).push(visitas[i]); }
      var ks=Object.keys(vend);
      say('<b>Recorrido cerrado.</b>\n'+visitas.map(function(v){
        var s=pmScore(v);
        return '· PDV '+esc(v.pdv)+' ('+esc(v.vendedor)+')'+(s?' — PM '+s.pct+'%':'');
      }).join('\n')+'\n\n'+ks.length+(ks.length===1?' vendedor':' vendedores')+' en este recorrido.');
      chips(ks.length>1 ? ['pdf por vendedor','pdf completo'] : ['generar pdf'], function(c){
        if(c==='pdf completo'){
          buildPDF(visitas, null, true);
        } else {
          for(var i=0;i<ks.length;i++) buildPDF(vend[ks[i]], ks[i], i===ks.length-1);
        }
      });
    });
  }

  /* ===================== PDF ===================== */
  function buildPDF(lista, vendedor, ultimo){
    if(!window.jspdf){ say('No se cargó la librería de PDF. Conectate a internet y recargá — lo cargado no se pierde.','sys'); return; }
    var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    var M=16,W=210,R=W-M,TW=W-M*2;
    var fecha=new Date().toLocaleDateString('es-AR');
    var y=0, primera=true, vAct=null;

    function rule(yy,c){ doc.setDrawColor.apply(doc,c||[214,220,222]); doc.setLineWidth(.2); doc.line(M,yy,R,yy); }
    function head(v){
      doc.setFillColor(4,121,155); doc.rect(0,0,W,5,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(4,121,155);
      doc.text('RELEVAMIENTO PDV - REL',M,14);
      doc.setFontSize(19); doc.setTextColor(14,26,31);
      doc.text('PDV '+v.pdv,M,24);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(102,117,124);
      var l2='Vendedor '+(v.vendedor||'-')+
             '  |  '+(v.frecuencia||'-')+
             '  |  '+fecha+
             '  |  '+(v.relevadoPor||relevador()||'-');
      doc.text(l2,M,30);
      rule(34,[14,26,31]); y=43;
    }
    function space(h){ if(y+h>272){ doc.addPage(); head(vAct); } }
    function h3(t){ space(16); y+=3; doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(4,121,155); doc.text(t,M,y); y+=2.4; rule(y,[52,157,192]); y+=6; }

    for(var vi=0; vi<lista.length; vi++){
      var v=lista[vi]; vAct=v;
      if(!primera) doc.addPage();
      primera=false; head(v);

      // score PM destacado
      var s=pmScore(v);
      if(s){
        var col = s.pct>=80?[30,122,85]:(s.pct>=50?[184,119,9]:[179,38,30]);
        doc.setDrawColor.apply(doc,col); doc.setLineWidth(.5); doc.rect(M,y-2,TW,15);
        doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor.apply(doc,col);
        doc.text(s.pct+'%',M+4,y+9);
        doc.setFontSize(8); doc.setTextColor(102,117,124); doc.setFont('helvetica','normal');
        doc.text('PROGRAMA DE MERCADO',M+30,y+4.5);
        doc.setFont('helvetica','bold'); doc.setTextColor(14,26,31); doc.setFontSize(9);
        doc.text(s.si+' de '+s.tot+' criterios cumplidos'+(s.tot<7?'  ('+(7-s.tot)+' sin evaluar)':''),M+30,y+10);
        y+=22;
      }

      for(var bi=0; bi<BLOQUES.length; bi++){
        var B=BLOQUES[bi], filas=[];
        for(var ii=0; ii<B.items.length; ii++){
          var r=(v.resp||{})[B.items[ii].id];
          if(r && (r.val||r.com)) filas.push(r);
        }
        if(!filas.length) continue;
        h3(B.nombre.toUpperCase());
        for(var f=0; f<filas.length; f++){
          var row=filas[f];
          var QL=doc.splitTextToSize(row.q,64);
          var txt=(row.val||'-')+(row.com?'  ('+row.com+')':'');
          var VL=doc.splitTextToSize(txt,TW-72);
          var hh=Math.max(QL.length,VL.length)*4.6+3.4;
          space(hh);
          if(row.mal){ doc.setFillColor(251,239,238); doc.rect(M-1.5,y-3.6,TW+3,hh-1,'F'); }
          doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(102,117,124);
          for(var q1=0;q1<QL.length;q1++) doc.text(QL[q1],M,y+q1*4.6);
          doc.setFont('helvetica','bold');
          if(row.mal) doc.setTextColor(179,38,30); else doc.setTextColor(14,26,31);
          for(var q2=0;q2<VL.length;q2++) doc.text(VL[q2],M+72,y+q2*4.6);
          y+=hh;
          doc.setDrawColor(232,236,238); doc.setLineWidth(.15); doc.line(M,y-2.6,R,y-2.6);
        }
        y+=3;
      }

      var notas=v.items.filter(function(i){ return i.t==='nota'; });
      if(notas.length){
        h3('NOTAS DE LA VISITA');
        for(var k=0;k<notas.length;k++){
          var L=doc.splitTextToSize(notas[k].text,TW-6);
          space(L.length*5.2+3);
          doc.setFillColor(52,157,192); doc.rect(M,y-1.6,2.4,1.2,'F');
          doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(14,26,31);
          for(var q3=0;q3<L.length;q3++) doc.text(L[q3],M+6,y+q3*5.2);
          y+=L.length*5.2+3;
        }
      }

      var fotos=v.items.filter(function(i){ return i.t==='foto'; });
      if(fotos.length){
        h3('EVIDENCIA FOTOGRAFICA');
        var cw=(TW-8)/2;      // ancho de columna
        var MAXH=86;          // alto máximo: con esto entran 4 fotos verticales por hoja
        for(var i2=0;i2<fotos.length;i2+=2){
          var row2=fotos.slice(i2,i2+2);
          // la foto se ajusta al alto máximo manteniendo la proporción
          var dim=row2.map(function(z){
            var w=cw, h=cw*(z.h/z.w);
            if(h>MAXH){ h=MAXH; w=MAXH*(z.w/z.h); }
            return {w:w, h:h};
          });
          var cap=row2.map(function(z){
            var t2=(z.ref?z.ref+' - ':'')+z.caption;
            return t2.trim()?doc.splitTextToSize(t2,cw-9).length*4:0;
          });
          var rowH=Math.max.apply(null,dim.map(function(d,n){ return d.h+cap[n]; }))+9;
          space(rowH);
          for(var k2=0;k2<row2.length;k2++){
            var s2=row2[k2], d2=dim[k2];
            var x=M+k2*(cw+8)+(cw-d2.w)/2;   // centrada en su columna
            doc.addImage(s2.url,'JPEG',x,y,d2.w,d2.h);
            doc.setDrawColor(214,220,222); doc.setLineWidth(.2); doc.rect(x,y,d2.w,d2.h);
            var xt=M+k2*(cw+8);
            doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(4,121,155);
            doc.text('F'+pad(i2+k2+1),xt,y+d2.h+4.5);
            var ct=(s2.ref?s2.ref+' - ':'')+s2.caption;
            if(ct.trim()){
              doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(14,26,31);
              var CL=doc.splitTextToSize(ct,cw-9);
              for(var q4=0;q4<CL.length;q4++) doc.text(CL[q4],xt+9,y+d2.h+4.5+q4*4);
            }
          }
          y+=rowH;
        }
      }

    }

    var np=doc.internal.getNumberOfPages();
    for(var p2=1;p2<=np;p2++){
      doc.setPage(p2);
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(102,117,124);
      doc.text('Relevamiento de campo - REL',M,289);
      doc.text(p2+' / '+np,R,289,{align:'right'});
    }

    var d=new Date();
    var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var name=(vendedor? vendedor+'_'+stamp : 'Recorrido_'+stamp)+'.pdf';
    var blob=doc.output('blob');
    var url=URL.createObjectURL(blob);
    say('<b>'+(vendedor?esc(vendedor):'Recorrido completo')+'</b> · '+lista.length+' PDV\n<a class="dl" href="'+url+'" download="'+name+'" target="_blank" rel="noopener">Abrir / descargar</a>');
    if(driveURL()) subirDrive(lista, vendedor, blob, name);

    if(ultimo){
      dbClear().then(function(){
        if(saveT){ clearTimeout(saveT); saveT=null; }
        visitas=[]; cur=null; step='pdv'; queue=[]; chk=null; stage(); counters();
        say(driveURL()?'Recorrido liberado. Ya quedó en tu Drive.':'Recorrido liberado. Guardá los PDF antes de cerrar la página.','sys');
        say('Listo para arrancar. Escribí el código de PDV.');
        chips([]);
      });
    }
  }

  /* ===================== arranque ===================== */
  openDB().then(function(){ return dbAll(); }).then(function(prev){
    step='pdv'; queue=[];
    if(prev && prev.length){
      prev.sort(function(a,b){ return a.id.localeCompare(b.id); });
      visitas=[]; cur=null;
      for(var i=0;i<prev.length;i++){
        if(prev[i].abierto && !cur) cur=prev[i]; else visitas.push(prev[i]);
      }
      stage(); counters();
      var l=visitas.map(function(v){ return '· PDV '+esc(v.pdv)+' — '+nreg(v)+' reg.'; }).join('\n');
      say('Recuperé un recorrido sin cerrar:'+(l?'\n'+l:'')+
          (cur?'\n· PDV '+esc(cur.pdv)+' — '+nreg(cur)+' reg. (quedó abierto)':''),'sys');
      if(cur){
        step = !cur.vendedor ? 'vendedor' : (!cur.frecuencia ? 'frecuencia' : 'carga');
        if(step==='vendedor'){ say('Seguimos con el <b>PDV '+esc(cur.pdv)+'</b>. ¿Código de vendedor? (solo números)'); chips([]); }
        else if(step==='frecuencia'){ say('Seguimos con el <b>PDV '+esc(cur.pdv)+'</b>. ¿Frecuencia de visita?'); chips(FRECUENCIAS, function(f){ me(f); setFrecuencia(f); }); }
        else { say('Seguimos con el <b>PDV '+esc(cur.pdv)+'</b>. Cargá lo que falte, o '+cmd('siguiente')+' para pasar al próximo.'); menu(); }
      } else {
        say('Seguí cargando o '+cmd('cerrar')+' para generar el PDF.\nSi algo quedó mal, '+cmd('corregir')+' abre cualquier PDV del recorrido.');
        chips(['corregir','ver','cerrar']);
      }
      return;
    }
    stage(); counters();
    if(!relevador()){
      step='nombre';
      say('Antes de arrancar: <b>¿quién sos?</b>\nLo uso para identificar quién carga cada relevamiento en la planilla. Solo te lo pregunto esta vez.','sys');
      chips(RELEVADORES.concat(['Otro']), elegirRelevador); return;
    }
    say('Hola <b>'+esc(relevador())+'</b>. Arrancamos el recorrido.\nEscribí el <b>código de PDV</b> para empezar.\n'+cmd('ayuda')+' para ver los comandos.');
    chips([]);
  });
})();
</script>
