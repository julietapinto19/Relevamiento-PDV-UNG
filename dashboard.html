<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Relevamiento — REL</title>
<meta name="theme-color" content="#0E1A1F">
<style>
  :root{
    --teal:#04799b; --teal-lt:#349dc0; --teal-pale:#E4F2F6;
    --ink:#0E1A1F; --paper:#EDF0F1; --card:#fff;
    --steel:#66757C; --line:#D6DCDE;
    --red:#B3261E; --red-pale:#FBECEB;
    --amber:#B87709; --amber-pale:#FBF1DC;
    --green:#1E7A55; --green-pale:#E6F2ED;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:0 20px 70px}

  .bar{background:var(--ink);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .bar .mark{width:36px;height:36px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;flex:0 0 auto}
  .bar h1{font-size:15px;font-weight:600;letter-spacing:-.015em}
  .bar .st{font-family:var(--mono);font-size:10px;color:var(--teal-lt);letter-spacing:.09em;text-transform:uppercase}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:11px}
  .bar .upd{font-family:var(--mono);font-size:10px;color:#93A4AB;text-align:right;line-height:1.35}
  .bar .upd b{color:#fff;font-size:14px}
  button{font-family:var(--sans);cursor:pointer;border-radius:0;font-size:13px}
  .btn{background:var(--teal);color:#fff;border:none;padding:10px 17px;font-weight:600}
  .btn:hover{background:var(--teal-lt)}
  .btn.gh{background:transparent;border:1px solid #3A4650;color:#C8D2D8;padding:9px 13px;font-weight:500}
  .btn.gh:hover{border-color:var(--teal-lt);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .tabs{display:flex;background:var(--ink);margin:0;padding:0 20px;position:sticky;top:62px;z-index:29;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{background:none;border:none;color:#93A4AB;padding:12px 17px;font-size:13.5px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
  .tab:hover{color:#fff}
  .tab.on{color:#fff;border-bottom-color:var(--teal-lt);font-weight:600}
  .tab .n{font-family:var(--mono);font-size:10px;background:#2A343D;padding:1px 5px;margin-left:6px}
  .tab.on .n{background:var(--teal)}
  .tab .n.alerta{background:var(--red);color:#fff}

  .filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-top:none;padding:13px 15px;margin-bottom:22px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
  .f select,.f input{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:none;border-radius:0;min-width:125px}
  .f select:focus,.f input:focus{border-color:var(--teal)}
  .f .rst{background:none;border:none;color:var(--teal);font-size:12px;padding:8px 4px;font-weight:600}

  section{margin-bottom:26px}
  h2{font-size:10.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);
     padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:0;display:flex;align-items:baseline;gap:10px}
  h2 .sub{font-family:var(--sans);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--steel);margin-left:auto;font-weight:400}
  .panel{background:var(--card);border:1px solid var(--line);border-top:none}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}
  .kpi{background:var(--card);padding:15px 17px}
  .kpi .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:7px}
  .kpi .v{font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1}
  .kpi .n{font-size:11.5px;color:var(--steel);margin-top:5px}
  .kpi.ok .v{color:var(--green)} .kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--red)}

  .semaforo{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:20px 22px}
  @media (max-width:600px){.semaforo{grid-template-columns:1fr;gap:16px;justify-items:center}}
  .sem-leyenda{display:flex;flex-direction:column;gap:11px;width:100%}
  .sl{display:flex;align-items:center;gap:11px}
  .sl .c{width:12px;height:12px;flex:0 0 auto}
  .sl .t{font-size:13px}
  .sl .q{font-family:var(--mono);font-size:15px;font-weight:600;margin-left:auto;padding-left:20px}
  .sl .p{font-family:var(--mono);font-size:11px;color:var(--steel);width:44px;text-align:right}

  .bars{padding:16px 18px}
  .bl{margin-bottom:13px}
  .bl-top{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .bl .lab{font-size:13px}
  .bl .val{font-family:var(--mono);font-size:13px;font-weight:600;margin-left:auto}
  .bl .val small{font-size:10px;color:var(--steel);font-weight:400;margin-left:5px}
  .track{height:10px;background:var(--paper);position:relative;display:block}
  .fill{height:100%;display:block;background:var(--green)}
  .bl.mid .fill{background:var(--amber)} .bl.low .fill{background:var(--red)}
  .grupo{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);
         margin:22px 0 13px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .grupo:first-child{margin-top:0}
  .grupo span{color:var(--ink);font-weight:600}

  .accs{padding:0}
  .acc{padding:15px 18px;border-bottom:1px solid var(--line)}
  .acc:last-child{border-bottom:none}
  .acc.r{border-left:3px solid var(--red)}
  .acc.a{border-left:3px solid var(--amber)}
  .acc.g{border-left:3px solid var(--green)}
  .acc-h{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
  .acc .tag{font-family:var(--mono);font-size:9px;letter-spacing:.11em;font-weight:600;padding:3px 7px}
  .acc.r .tag{background:var(--red-pale);color:var(--red)}
  .acc.a .tag{background:var(--amber-pale);color:var(--amber)}
  .acc.g .tag{background:var(--green-pale);color:var(--green)}
  .acc .niv{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--steel)}
  .acc .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--steel)}
  .acc-t{font-size:15.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:8px;line-height:1.3}
  .comos{list-style:none;margin-bottom:7px}
  .comos li{font-size:12.5px;padding:3px 0 3px 15px;position:relative;line-height:1.45}
  .comos li::before{content:'';position:absolute;left:0;top:11px;width:7px;height:1px;background:var(--teal)}
  .acc details{font-size:12px}
  .acc summary{cursor:pointer;color:var(--teal);font-size:11.5px;font-weight:600;padding:3px 0;list-style:none}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::before{content:'▸ '}
  .acc details[open] summary::before{content:'▾ '}
  .casos{margin-top:7px;border-top:1px solid var(--line);padding-top:7px;max-height:230px;overflow-y:auto}
  .caso{font-size:12px;color:var(--steel);padding:4px 0;line-height:1.45;border-bottom:1px solid var(--paper)}
  .caso:last-child{border-bottom:none}
  .caso b{font-family:var(--mono);color:var(--ink);font-weight:600;margin-right:6px}

  .por-pdv{padding:0}
  .grupo-pdv{border-bottom:1px solid var(--line)}
  .grupo-pdv:last-child{border-bottom:none}
  .gp-h{display:flex;align-items:baseline;gap:11px;padding:13px 18px 9px;background:#FAFBFB;flex-wrap:wrap}
  .gp-t{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em}
  .gp-s{font-size:11.5px;color:var(--steel)}
  .gp-n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--steel)}
  .gp-n.urg{color:var(--red);font-weight:600}
  .gp-a{padding:11px 18px 11px 21px;border-top:1px solid var(--paper);border-left:3px solid transparent}
  .gp-a.r{border-left-color:var(--red)}
  .gp-a.a{border-left-color:var(--amber)}
  .gp-a.g{border-left-color:var(--green)}
  .gp-at{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
  .gp-ap{font-size:12px;color:var(--steel);line-height:1.45;margin-bottom:5px}
  .gp-a .comos li{font-size:12px;padding:2px 0 2px 15px}

  .filtro-urg{display:flex;gap:7px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#FAFBFB}
  .fu{font-family:var(--mono);font-size:10.5px;background:var(--card);border:1px solid var(--line);color:var(--steel);padding:6px 11px;letter-spacing:.04em}
  .fu.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--steel);
     text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  th.n,td.n{text-align:right}
  td{padding:10px 12px;border-bottom:1px solid var(--paper)}
  tr:last-child td{border-bottom:none}
  td.cod{font-family:var(--mono);font-weight:600}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;min-width:46px;text-align:center}
  .pill.g{background:var(--green-pale);color:var(--green)}
  .pill.a{background:var(--amber-pale);color:var(--amber)}
  .pill.r{background:var(--red-pale);color:var(--red)}
  .delta{font-family:var(--mono);font-size:12px;font-weight:600}
  .delta.up{color:var(--green)} .delta.dn{color:var(--red)} .delta.eq{color:var(--steel)}
  .mini{font-size:11px;color:var(--steel)}
  .nota-pie{font-size:11.5px;color:var(--steel);padding:2px;line-height:1.55}

  .setup{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--teal);padding:26px;max-width:620px;margin:40px auto}
  .setup h3{font-size:18px;margin-bottom:8px;letter-spacing:-.02em}
  .setup p{font-size:13.5px;color:var(--steel);margin-bottom:16px;line-height:1.55}
  .setup input{width:100%;font-family:var(--mono);font-size:12.5px;padding:11px;border:1px solid var(--line);background:var(--paper);outline:none;margin-bottom:12px}
  .setup input:focus{border-color:var(--teal)}
  .msg{padding:12px 14px;font-size:13px;margin-bottom:14px}
  .msg.err{background:var(--red-pale);color:var(--red);border-left:3px solid var(--red)}
  .msg.ok{background:var(--green-pale);color:var(--green);border-left:3px solid var(--green)}
  .vacio{text-align:center;padding:52px 20px;color:var(--steel);font-size:13.5px;line-height:1.6}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
  .hidden{display:none !important}
  @media print{.bar,.tabs,.filtros,.btn,.filtro-urg{display:none}body{background:#fff}section{break-inside:avoid}}
</style>
</head>
<body>

<div class="bar">
  <div class="mark">REL</div>
  <div>
    <h1>Dashboard de Relevamiento</h1>
    <div class="st">Territorio UNG</div>
  </div>
  <div class="right">
    <div class="upd" id="upd"></div>
    <button class="btn gh hidden" id="btn-cfg">Origen</button>
    <button class="btn hidden" id="btn-upd">Actualizar</button>
  </div>
</div>

<div class="tabs hidden" id="tabs"></div>

<div class="shell">
  <div class="setup" id="setup">
    <h3>Conectar con tu planilla</h3>
    <p>Pegá la misma URL de Apps Script que usás en el bot. Termina en <b>/exec</b>.
       Queda guardada en este dispositivo: solo hay que hacerlo una vez.</p>
    <div id="setup-msg"></div>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false">
    <button class="btn" id="btn-conn">Conectar</button>
  </div>

  <div id="app" class="hidden">
    <div class="filtros">
      <div class="f"><label for="f-desde">Desde</label><input type="date" id="f-desde"></div>
      <div class="f"><label for="f-hasta">Hasta</label><input type="date" id="f-hasta"></div>
      <div class="f"><label for="f-vend">Vendedor</label><select id="f-vend"></select></div>
      <div class="f"><label for="f-frec">Frecuencia</label><select id="f-frec"></select></div>
      <div class="f"><label for="f-pdv">PDV</label><select id="f-pdv"></select></div>
      <div class="f"><label for="f-quien">Relevado por</label><select id="f-quien"></select></div>
      <div class="f"><button class="rst" id="f-reset">Limpiar</button></div>
    </div>
    <div id="cuerpo"></div>
  </div>
</div>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var KEY='relevamiento_dash_url';
  var COLS=[], FILAS=[], IDX={};
  var TAB='resumen', URG='todas', VISTA='pdv';

  var PM_SCORE = [
    ['PM 60% Facing Gatorade','60% Facing share Gatorade'],
    ['PM EDF espejo CCX','EDF espejo CCX'],
    ['PM 35% FS Gondola','35% FS Góndola'],
    ['PM 1 puntera','1 puntera'],
    ['PM 2 exhibiciones','2 exhibiciones']
  ];
  var PM_EXTRA = [
    ['PM 30% FS Aguas','30% FS Aguas'],
    ['PM 30% FS Saborizadas','30% FS Saborizadas']
  ];
  var PM = PM_SCORE.concat(PM_EXTRA);
  var FOCOS = [
    ['Foco 2.25L','2.25L'], ['Foco 3L','3L'], ['Foco 2L','2L'], ['Foco 1.5L','1.5L'],
    ['Foco Still','Still'], ['Foco Individuales','Individuales'], ['Foco GTD Zero','GTD Zero']
  ];
  var PRECIOS = [
    ['PTC 2.25L','2.25L','propio'], ['PTC 3L','3L','propio'], ['PTC 2L','2L','propio'],
    ['PTC 1.5L','1.5L','propio'], ['PTC Still 1.5L','Still 1.5L','propio'], ['PTC Zero','Zero','propio'],
    ['Precio Manaos 2.25L','Manaos 2.25L','competencia'],
    ['Precio Placer 1.5L','Placer 1.5L','competencia'],
    ['Precio CCX 2L RET','CCX 2L RET','competencia']
  ];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function cel(f,n){ var i=IDX[n]; return i==null?'':f[i]; }
  function txt(r,c){ return String(cel(r,c)||'').trim(); }
  function si(v){ var x=String(v).trim(); return x==='Sí'||x==='Si'; }
  function tono(p){ return p>=80?'g':(p>=50?'a':'r'); }
  function tonoK(p){ return p>=80?'ok':(p>=50?'warn':'bad'); }
  function plata(n){ return '$'+Math.round(n).toLocaleString('es-AR'); }

  /* ================= conexión ================= */
  function url(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }

  $('btn-conn').onclick = function(){
    var u = $('url').value.trim();
    if(u.indexOf('https://script.google.com/')!==0 || u.indexOf('/exec')<0){
      $('setup-msg').innerHTML='<div class="msg err">Esa no parece la URL correcta. Tiene que empezar con https://script.google.com/ y terminar en /exec.</div>';
      return;
    }
    try{ localStorage.setItem(KEY,u); }catch(e){}
    $('setup-msg').innerHTML='<div class="msg ok"><span class="spin"></span>Conectando…</div>';
    cargar(true);
  };
  $('btn-cfg').onclick = function(){
    $('app').className='hidden'; $('setup').className='setup'; $('tabs').className='tabs hidden';
    $('btn-upd').className='btn hidden'; $('btn-cfg').className='btn gh hidden';
    $('url').value=url(); $('setup-msg').innerHTML='';
  };
  $('btn-upd').onclick = function(){ cargar(false); };

  function cargar(primera){
    var u=url(); if(!u) return;
    var b=$('btn-upd'); b.disabled=true; b.innerHTML='<span class="spin"></span>Actualizando';
    fetch(u+(u.indexOf('?')<0?'?':'&')+'datos=1&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok) throw new Error(d && d.error ? d.error : 'respuesta inesperada');
        COLS=d.columnas||[]; FILAS=d.filas||[];
        IDX={}; for(var i=0;i<COLS.length;i++) IDX[String(COLS[i]).trim()]=i;
        $('setup').className='setup hidden'; $('app').className=''; $('tabs').className='tabs';
        $('btn-upd').className='btn'; $('btn-cfg').className='btn gh';
        var n=new Date();
        $('upd').innerHTML='<b>'+FILAS.length+'</b> visitas<br>'+
          n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
        if(primera) llenarFiltros();
        pintar();
      })['catch'](function(e){
        var m='<div class="msg err">No pude leer la planilla. '+esc(e.message||'')+
              '<br><br>Si publicaste el script antes de agregar el lector de datos, entrá a '+
              '<b>Implementar → Administrar implementaciones</b>, tocá el lápiz y elegí <b>Nueva versión</b>.</div>';
        if(primera) $('setup-msg').innerHTML=m; else $('cuerpo').innerHTML=m;
      })
      ['finally'](function(){ b.disabled=false; b.textContent='Actualizar'; });
  }

  /* ================= filtros ================= */
  function llenarFiltros(){
    var vs={}, fs={}, qs={}, ps={};
    for(var i=0;i<FILAS.length;i++){
      var v=cel(FILAS[i],'Cod Vendedor'), f=cel(FILAS[i],'Frecuencia'),
          q=cel(FILAS[i],'Relevado por'), p=cel(FILAS[i],'Cod PDV');
      if(v) vs[v]=1; if(f) fs[f]=1; if(q) qs[q]=1; if(p) ps[p]=1;
    }
    opciones($('f-vend'),'Todos',Object.keys(vs).sort());
    opciones($('f-frec'),'Todas',Object.keys(fs).sort());
    opciones($('f-quien'),'Todos',Object.keys(qs).sort());
    opciones($('f-pdv'),'Todos',Object.keys(ps).sort());
    ['f-desde','f-hasta','f-vend','f-frec','f-quien','f-pdv'].forEach(function(id){ $(id).onchange=pintar; });
    $('f-reset').onclick=function(){
      ['f-desde','f-hasta'].forEach(function(id){ $(id).value=''; });
      $('f-vend').selectedIndex=0; $('f-frec').selectedIndex=0;
      $('f-quien').selectedIndex=0; $('f-pdv').selectedIndex=0; pintar();
    };
  }
  function opciones(sel,todos,arr){
    sel.innerHTML='<option value="">'+todos+'</option>'+
      arr.map(function(x){ return '<option>'+esc(x)+'</option>'; }).join('');
  }
  function filtradas(){
    var d=$('f-desde').value, h=$('f-hasta').value,
        v=$('f-vend').value, f=$('f-frec').value, q=$('f-quien').value, pv=$('f-pdv').value;
    return FILAS.filter(function(r){
      var fe=String(cel(r,'Fecha')||'').slice(0,10);
      if(d && fe<d) return false;
      if(h && fe>h) return false;
      if(v && cel(r,'Cod Vendedor')!==v) return false;
      if(f && cel(r,'Frecuencia')!==f) return false;
      if(q && cel(r,'Relevado por')!==q) return false;
      if(pv && String(cel(r,'Cod PDV'))!==pv) return false;
      return true;
    });
  }

  function score(r){
    var v=cel(r,'PM Score %');
    if(v===''||v==null) return null;
    var n=parseFloat(v);
    if(isNaN(n)) return null;
    return n<=1 ? Math.round(n*100) : Math.round(n);
  }

  /* ================= router de solapas ================= */
  function pintar(){
    var F=filtradas();
    var A=F.length?acciones(F):[];
    var urg=0;
    for(var u=0;u<A.length;u++) if(A[u].prio===1) urg++;

    var defs=[['resumen','Resumen',''],
              ['acciones','Acciones', A.length?String(A.length):''],
              ['ejecucion','Ejecución',''],
              ['precios','Precios',''],
              ['equipo','Equipo','']];
    $('tabs').innerHTML = defs.map(function(d){
      var badge = d[2] ? '<span class="n'+(d[0]==='acciones'&&urg?' alerta':'')+'">'+d[2]+'</span>' : '';
      return '<button class="tab'+(TAB===d[0]?' on':'')+'" data-t="'+d[0]+'">'+d[1]+badge+'</button>';
    }).join('');
    var bs=$('tabs').querySelectorAll('.tab');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=(function(b){ return function(){
        TAB=b.getAttribute('data-t'); pintar(); window.scrollTo(0,0);
      };})(bs[i]);
    }

    if(!F.length){
      $('cuerpo').innerHTML='<div class="panel" style="border-top:1px solid var(--line)"><div class="vacio">'+
        'No hay visitas con estos filtros.<br>'+
        (FILAS.length?'Probá limpiar los filtros.':'La planilla todavía no tiene datos cargados.')+'</div></div>';
      return;
    }

    if(TAB==='resumen'){ $('cuerpo').innerHTML = tabResumen(F, A); engancharResumen(A); }
    else if(TAB==='acciones'){ $('cuerpo').innerHTML = tabAcciones(A); engancharUrgencia(A); }
    else if(TAB==='ejecucion') $('cuerpo').innerHTML = tabEjecucion(F);
    else if(TAB==='precios') $('cuerpo').innerHTML = tabPrecios(F);
    else $('cuerpo').innerHTML = tabEquipo(F);
  }

  function sec(titulo, sub, contenido){
    return '<section><h2>'+esc(titulo)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</h2>'+
           '<div class="panel">'+contenido+'</div></section>';
  }
  function box(k,v,n,cls){
    return '<div class="kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="n">'+n+'</div></div>';
  }

  /* ================= RESUMEN ================= */
  function tabResumen(F, A){
    var sc=[], verde=0, ambar=0, rojo=0, sinScore=0;
    var pdvs={}, vend={}, quienes={};
    for(var i=0;i<F.length;i++){
      var s=score(F[i]);
      if(s===null) sinScore++;
      else { sc.push(s); if(s>=80) verde++; else if(s>=50) ambar++; else rojo++; }
      pdvs[cel(F[i],'Cod PDV')]=1;
      vend[cel(F[i],'Cod Vendedor')]=1;
      var z=cel(F[i],'Relevado por'); if(z) quienes[z]=1;
    }
    var prom = sc.length ? Math.round(sc.reduce(function(a,b){return a+b},0)/sc.length) : null;
    var urg=0;
    for(var u=0;u<A.length;u++) if(A[u].prio===1) urg++;

    var html='<div class="kpis">'+
      box('Visitas', F.length, Object.keys(pdvs).length+' PDV distintos') +
      box('PM promedio', prom===null?'—':prom+'%', 'sobre 5 criterios', prom===null?'':tonoK(prom)) +
      box('PDV críticos', rojo, 'con PM menor a 50%', rojo?'bad':'ok') +
      box('Acciones', A.length, urg+' urgentes', urg?'bad':'ok') +
      box('Vendedores', Object.keys(vend).length, Object.keys(quienes).length+' relevando') +
      '</div>';

    var tot=verde+ambar+rojo;
    if(tot){
      var seg=[[verde,'#1E7A55','Bien ejecutados','80% o más'],
               [ambar,'#B87709','A trabajar','entre 50% y 79%'],
               [rojo,'#B3261E','Críticos','menos de 50%']];
      var acum=0, anillo='', R=52, C=2*Math.PI*R;
      for(var k=0;k<seg.length;k++){
        if(!seg[k][0]) continue;
        var frac=seg[k][0]/tot;
        anillo+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+seg[k][1]+'" stroke-width="15" '+
                'stroke-dasharray="'+(frac*C)+' '+C+'" stroke-dashoffset="'+(-acum*C)+'" '+
                'transform="rotate(-90 60 60)"></circle>';
        acum+=frac;
      }
      var leyenda='';
      for(var q=0;q<seg.length;q++){
        leyenda+='<div class="sl"><span class="c" style="background:'+seg[q][1]+'"></span>'+
                 '<span class="t">'+seg[q][2]+' <span class="mini">· '+seg[q][3]+'</span></span>'+
                 '<span class="q">'+seg[q][0]+'</span>'+
                 '<span class="p">'+Math.round(seg[q][0]/tot*100)+'%</span></div>';
      }
      html+=sec('Estado del territorio',
        tot+' visitas evaluadas'+(sinScore?' · '+sinScore+' sin Programa de Mercado':''),
        '<div class="semaforo"><svg width="120" height="120" viewBox="0 0 120 120">'+anillo+
        '<text x="60" y="57" text-anchor="middle" font-family="ui-monospace,monospace" font-size="26" font-weight="600" fill="#0E1A1F">'+tot+'</text>'+
        '<text x="60" y="74" text-anchor="middle" font-family="system-ui" font-size="9" fill="#66757C">VISITAS</text>'+
        '</svg><div class="sem-leyenda">'+leyenda+'</div></div>');
    }

    if(A.length){
      html+=sec('Lo primero a resolver','Las 3 acciones más urgentes',
        '<div class="accs">'+A.slice(0,3).map(tarjetaAccion).join('')+'</div>'+
        (A.length>3?'<div style="padding:13px 18px;border-top:1px solid var(--line)">'+
          '<button class="btn" id="ir-acciones">Ver las '+A.length+' acciones</button></div>':''));
    }
    return html;
  }
  function engancharResumen(){
    var b=$('ir-acciones');
    if(b) b.onclick=function(){ TAB='acciones'; pintar(); window.scrollTo(0,0); };
  }

  /* ================= ACCIONES ================= */
  function tabAcciones(A){
    if(!A.length){
      return sec('Acciones sugeridas','',
        '<div class="vacio">No se detectaron problemas ni oportunidades en el período filtrado.</div>');
    }
    var cuenta={1:0,2:0,3:0};
    for(var i=0;i<A.length;i++) cuenta[A[i].prio]++;
    var filtros=[['todas','Todas ('+A.length+')'],
                 ['1','Urgentes ('+cuenta[1]+')'],
                 ['2','Importantes ('+cuenta[2]+')'],
                 ['3','Oportunidades ('+cuenta[3]+')']];
    var lista=[];
    for(var k=0;k<A.length;k++){
      if(URG==='todas' || String(A[k].prio)===URG) lista.push(A[k]);
    }

    var barra='<div class="filtro-urg">'+
      '<button class="fu'+(VISTA==='pdv'?' on':'')+'" data-v="pdv">Por PDV</button>'+
      '<button class="fu'+(VISTA==='accion'?' on':'')+'" data-v="accion">Por acción</button>'+
      '<span style="width:14px"></span>'+
      filtros.map(function(f){
        return '<button class="fu'+(URG===f[0]?' on':'')+'" data-u="'+f[0]+'">'+f[1]+'</button>';
      }).join('')+
      '<button class="fu" id="btn-copiar" style="margin-left:auto">Copiar para WhatsApp</button>'+
      '</div>';

    if(VISTA==='accion'){
      return sec('Acciones sugeridas', A.length+' en total',
        barra+'<div class="accs">'+(lista.length?lista.map(tarjetaAccion).join(''):
          '<div class="vacio">Nada en esta categoría.</div>')+'</div>');
    }

    /* --- agrupado por PDV: lo que hay que hacer en cada local --- */
    var porPDV={};
    for(var a=0;a<lista.length;a++){
      var x=lista[a];
      if(x.nivel!=='PDV'){
        var kg='__'+x.nivel;
        porPDV[kg]=porPDV[kg]||{pdv:x.quien, vend:'', fecha:'', nivel:x.nivel, acc:[]};
        porPDV[kg].acc.push({prio:x.prio, titulo:x.titulo, porque:x.casos[0].porque, comos:x.comos});
        continue;
      }
      for(var c=0;c<x.casos.length;c++){
        var m=x.casos[c].meta||{};
        var key=m.pdv||x.casos[c].quien;
        porPDV[key]=porPDV[key]||{pdv:m.pdv||key, vend:m.vend||'', fecha:m.fecha||'', nivel:'PDV', acc:[]};
        if(m.fecha>porPDV[key].fecha) porPDV[key].fecha=m.fecha;
        porPDV[key].acc.push({prio:x.prio, titulo:x.titulo, porque:x.casos[c].porque, comos:x.comos});
      }
    }
    var grupos=[];
    for(var g in porPDV){
      var o=porPDV[g];
      o.acc.sort(function(p,q){ return p.prio-q.prio; });
      o.urg=0;
      for(var u=0;u<o.acc.length;u++) if(o.acc[u].prio===1) o.urg++;
      grupos.push(o);
    }
    grupos.sort(function(p,q){
      if(p.nivel!==q.nivel) return p.nivel==='PDV'?-1:1;
      if(q.urg!==p.urg) return q.urg-p.urg;
      return q.acc.length-p.acc.length;
    });

    var html='';
    for(var i2=0;i2<grupos.length;i2++){
      var G=grupos[i2];
      var titulo = G.nivel==='PDV' ? 'PDV '+esc(G.pdv) : esc(G.pdv);
      var sub = G.nivel==='PDV'
        ? (G.vend?esc(G.vend):'')+(G.fecha?' · última visita '+esc(G.fecha):'')
        : G.nivel;
      html+='<div class="grupo-pdv">'+
        '<div class="gp-h"><span class="gp-t">'+titulo+'</span>'+
        '<span class="gp-s">'+sub+'</span>'+
        '<span class="gp-n'+(G.urg?' urg':'')+'">'+G.acc.length+
          (G.acc.length===1?' acción':' acciones')+(G.urg?' · '+G.urg+' urgente'+(G.urg>1?'s':''):'')+'</span></div>';
      for(var j=0;j<G.acc.length;j++){
        var ac=G.acc[j];
        var cls = ac.prio===1?'r':(ac.prio===2?'a':'g');
        html+='<div class="gp-a '+cls+'">'+
          '<div class="gp-at">'+esc(ac.titulo)+'</div>'+
          '<div class="gp-ap">'+esc(ac.porque)+'</div>'+
          '<ul class="comos">'+ac.comos.slice(0,2).map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ul>'+
          '</div>';
      }
      html+='</div>';
    }
    var cuantosPDV=0;
    for(var z=0;z<grupos.length;z++) if(grupos[z].nivel==='PDV') cuantosPDV++;
    return sec('Acciones por punto de venta',
      cuantosPDV+' PDV con acciones pendientes',
      barra+'<div class="por-pdv">'+(html||'<div class="vacio">Nada en esta categoría.</div>')+'</div>');
  }

  /** arma el texto plano para mandarle al vendedor */
  function textoAcciones(A){
    var out=[], v=$('f-vend').value, p=$('f-pdv').value;
    out.push('ACCIONES PENDIENTES — REL Territorio UNG');
    if(v) out.push('Vendedor: '+v);
    if(p) out.push('PDV: '+p);
    var d=$('f-desde').value, h=$('f-hasta').value;
    if(d||h) out.push('Período: '+(d||'inicio')+' a '+(h||'hoy'));
    out.push('');
    var porPDV={};
    for(var a=0;a<A.length;a++){
      var x=A[a];
      if(URG!=='todas' && String(x.prio)!==URG) continue;
      if(x.nivel!=='PDV') continue;
      for(var c=0;c<x.casos.length;c++){
        var m=x.casos[c].meta||{};
        var key=m.pdv||x.casos[c].quien;
        porPDV[key]=porPDV[key]||{vend:m.vend||'', acc:[]};
        porPDV[key].acc.push({prio:x.prio, titulo:x.titulo, porque:x.casos[c].porque});
      }
    }
    for(var k in porPDV){
      porPDV[k].acc.sort(function(p1,p2){ return p1.prio-p2.prio; });
      out.push('PDV '+k+(porPDV[k].vend?' ('+porPDV[k].vend+')':''));
      for(var i=0;i<porPDV[k].acc.length;i++){
        var ac=porPDV[k].acc[i];
        var et = ac.prio===1?'[URGENTE] ':(ac.prio===2?'[IMPORTANTE] ':'[OPORTUNIDAD] ');
        out.push('  ' + et + ac.titulo);
        out.push('     ' + ac.porque);
      }
      out.push('');
    }
    return out.join('\n');
  }
  function engancharUrgencia(A){
    var bs=document.querySelectorAll('[data-u]');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=(function(b){ return function(){ URG=b.getAttribute('data-u'); pintar(); };})(bs[i]);
    }
    var vs=document.querySelectorAll('[data-v]');
    for(var k=0;k<vs.length;k++){
      vs[k].onclick=(function(b){ return function(){ VISTA=b.getAttribute('data-v'); pintar(); };})(vs[k]);
    }
    var cp=$('btn-copiar');
    if(cp) cp.onclick=function(){
      var t=textoAcciones(A);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){
          cp.textContent='Copiado'; setTimeout(function(){ cp.textContent='Copiar para WhatsApp'; },1800);
        })['catch'](function(){ prompt('Copiá el texto:', t); });
      } else prompt('Copiá el texto:', t);
    };
  }
  function tarjetaAccion(x){
    var cls = x.prio===1?'r':(x.prio===2?'a':'g');
    var et = x.prio===1?'URGENTE':(x.prio===2?'IMPORTANTE':'OPORTUNIDAD');
    return '<div class="acc '+cls+'">'+
      '<div class="acc-h"><span class="tag">'+et+'</span>'+
      '<span class="niv">'+esc(x.nivel)+'</span>'+
      '<span class="cnt">'+x.casos.length+(x.casos.length===1?' caso':' casos')+'</span></div>'+
      '<div class="acc-t">'+esc(x.titulo)+'</div>'+
      '<ul class="comos">'+x.comos.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ul>'+
      '<details><summary>Ver el detalle de cada caso</summary><div class="casos">'+
      x.casos.slice(0,25).map(function(c){
        return '<div class="caso"><b>'+esc(c.quien)+'</b> '+esc(c.porque)+'</div>';
      }).join('')+
      (x.casos.length>25?'<div class="caso mini">y '+(x.casos.length-25)+' más</div>':'')+
      '</div></details></div>';
  }

  /* ================= EJECUCIÓN ================= */
  function barras(F, defs){
    var arr=[];
    for(var i=0;i<defs.length;i++){
      var col=defs[i][0], nom=defs[i][1], ok=0, ev=0;
      for(var k=0;k<F.length;k++){
        var v=txt(F[k],col);
        if(!v) continue;
        ev++; if(si(v)) ok++;
      }
      arr.push({nom:nom, ok:ok, ev:ev, pct: ev?Math.round(ok/ev*100):null});
    }
    arr.sort(function(a,b){
      if(a.pct===null) return 1; if(b.pct===null) return -1;
      return a.pct-b.pct;
    });
    return arr.map(function(x){
      if(x.pct===null) return '<div class="bl"><div class="bl-top"><span class="lab">'+esc(x.nom)+
        '</span><span class="val mini">sin datos</span></div></div>';
      var cls = x.pct>=80?'':(x.pct>=50?'mid':'low');
      return '<div class="bl '+cls+'"><div class="bl-top"><span class="lab">'+esc(x.nom)+'</span>'+
        '<span class="val">'+x.pct+'%<small>'+x.ok+'/'+x.ev+'</small></span></div>'+
        '<span class="track"><span class="fill" style="width:'+x.pct+'%"></span></span></div>';
    }).join('');
  }

  function tabEjecucion(F){
    function cumple(col){
      var ok=0, ev=0;
      for(var i=0;i<F.length;i++){ var v=txt(F[i],col); if(!v) continue; ev++; if(si(v)) ok++; }
      return ev?{pct:Math.round(ok/ev*100), ok:ok, ev:ev}:null;
    }
    var plano='';
    var pares=[[cumple('Planograma Gondola'),'Planograma góndola'],
               [cumple('Planograma EDF'),'Planograma EDF']];
    for(var i=0;i<pares.length;i++){
      var x=pares[i][0];
      if(!x) continue;
      var cls = x.pct>=80?'':(x.pct>=50?'mid':'low');
      plano+='<div class="bl '+cls+'"><div class="bl-top"><span class="lab">'+pares[i][1]+'</span>'+
        '<span class="val">'+x.pct+'%<small>'+x.ok+'/'+x.ev+'</small></span></div>'+
        '<span class="track"><span class="fill" style="width:'+x.pct+'%"></span></span></div>';
    }
    var pop={Bueno:0,Regular:0,Malo:0}, popTot=0;
    for(var k=0;k<F.length;k++){
      var v=txt(F[k],'Estado material POP');
      if(pop[v]!==undefined){ pop[v]++; popTot++; }
    }
    var popHtml='';
    if(popTot){
      var col={Bueno:'green',Regular:'amber',Malo:'red'};
      ['Bueno','Regular','Malo'].forEach(function(e){
        var p=Math.round(pop[e]/popTot*100);
        popHtml+='<div class="bl"><div class="bl-top"><span class="lab">'+e+'</span>'+
          '<span class="val">'+p+'%<small>'+pop[e]+'/'+popTot+'</small></span></div>'+
          '<span class="track"><span class="fill" style="width:'+p+'%;background:var(--'+col[e]+')"></span></span></div>';
      });
    }

    return sec('Programa de Mercado','De peor a mejor cumplimiento',
        '<div class="bars">'+
        '<div class="grupo">Criterios que <span>puntúan</span> para el score</div>'+barras(F,PM_SCORE)+
        '<div class="grupo">Se relevan pero <span>no puntúan</span></div>'+barras(F,PM_EXTRA)+
        '</div>') +
      sec('Presencia de focos','Porcentaje de PDV que tiene cada foco',
        '<div class="bars">'+barras(F,FOCOS)+'</div>') +
      (plano?sec('Planograma','Cumple totalmente','<div class="bars">'+plano+'</div>'):'') +
      (popHtml?sec('Estado del material POP','','<div class="bars">'+popHtml+'</div>'):'');
  }

  /* ================= PRECIOS ================= */
  function tabPrecios(F){
    var datos={}, orden=[];
    for(var p=0;p<PRECIOS.length;p++){
      var col=PRECIOS[p][0], vals=[];
      for(var i=0;i<F.length;i++){
        var v=cel(F[i],col);
        if(v===''||v==null) continue;
        var n=parseFloat(String(v).replace(',','.'));
        if(!isNaN(n)&&n>0) vals.push({n:n, pdv:cel(F[i],'Cod PDV'), vend:cel(F[i],'Cod Vendedor')});
      }
      if(vals.length){ datos[col]={label:PRECIOS[p][1], tipo:PRECIOS[p][2], vals:vals}; orden.push(col); }
    }
    if(!orden.length){
      return sec('Precios relevados','',
        '<div class="vacio">Todavía no hay precios cargados.<br>'+
        'Aparecen cuando el foco está presente y se releva el PTC.</div>');
    }

    var filasP='', filasC='', desvios=[];
    for(var k=0;k<orden.length;k++){
      var d=datos[orden[k]];
      var ns=d.vals.map(function(x){return x.n}).sort(function(a,b){return a-b});
      var prom=ns.reduce(function(a,b){return a+b},0)/ns.length;
      var min=ns[0], max=ns[ns.length-1];
      var disp = prom ? Math.round((max-min)/prom*100) : 0;
      var fila='<tr><td>'+esc(d.label)+'</td>'+
        '<td class="n">'+d.vals.length+'</td>'+
        '<td class="n"><b>'+plata(prom)+'</b></td>'+
        '<td class="n mini">'+plata(min)+'</td>'+
        '<td class="n mini">'+plata(max)+'</td>'+
        '<td class="n"><span class="pill '+(disp>=25?'r':(disp>=15?'a':'g'))+'">'+disp+'%</span></td></tr>';
      if(d.tipo==='propio') filasP+=fila; else filasC+=fila;
      if(d.vals.length>=3){
        for(var q=0;q<d.vals.length;q++){
          var dif=(d.vals[q].n-prom)/prom;
          if(dif>=0.15) desvios.push({sku:d.label, pdv:d.vals[q].pdv, vend:d.vals[q].vend,
                                      precio:d.vals[q].n, prom:prom, pct:Math.round(dif*100)});
        }
      }
    }
    desvios.sort(function(a,b){ return b.pct-a.pct; });

    var cab='<table><thead><tr><th>SKU</th><th class="n">PDV</th><th class="n">Promedio</th>'+
            '<th class="n">Mínimo</th><th class="n">Máximo</th><th class="n">Dispersión</th></tr></thead><tbody>';
    var html='';
    if(filasP) html+=sec('Nuestros precios','PTC relevado en el punto de venta', cab+filasP+'</tbody></table>');
    if(filasC) html+=sec('Competencia','Relevado en el mismo PDV', cab+filasC+'</tbody></table>');
    if(desvios.length){
      var lista='';
      for(var w=0;w<Math.min(desvios.length,20);w++){
        var x=desvios[w];
        lista+='<div class="caso"><b>'+esc(x.pdv)+'</b> '+esc(x.vend)+' · '+esc(x.sku)+
               ' a '+plata(x.precio)+' <span style="color:var(--red);font-weight:600">+'+x.pct+'%</span>'+
               ' <span class="mini">(promedio '+plata(x.prom)+')</span></div>';
      }
      html+=sec('PDV fuera de línea', desvios.length+' casos 15% o más por encima',
        '<div style="padding:14px 16px">'+lista+'</div>');
    }
    html+='<p class="nota-pie">Sin PTC oficial cargado, la comparación es entre puntos de venta: '+
          'un PDV se marca cuando su precio se aleja del promedio del resto.</p>';
    return html;
  }

  /* ================= EQUIPO ================= */
  function tabEquipo(F){ return ranking(F) + evolucion(F); }

  function ranking(F){
    var por={};
    for(var i=0;i<F.length;i++){
      var v=cel(F[i],'Cod Vendedor')||'(sin vendedor)';
      var o=por[v]=por[v]||{v:v,n:0,sc:[],pdv:{},alertas:0};
      o.n++; o.pdv[cel(F[i],'Cod PDV')]=1;
      var s=score(F[i]); if(s!==null) o.sc.push(s);
      if(si(txt(F[i],'Productos vencidos'))) o.alertas++;
      var pg=txt(F[i],'Planograma Gondola'); if(pg==='No'||pg==='Parcial') o.alertas++;
      var pe=txt(F[i],'Planograma EDF'); if(pe==='No'||pe==='Parcial') o.alertas++;
    }
    var arr=[];
    for(var k in por){
      var o2=por[k];
      o2.prom = o2.sc.length ? Math.round(o2.sc.reduce(function(a,b){return a+b},0)/o2.sc.length) : null;
      arr.push(o2);
    }
    arr.sort(function(a,b){
      if(a.prom===null) return 1; if(b.prom===null) return -1;
      return b.prom-a.prom;
    });
    var html='<table><thead><tr><th>#</th><th>Vendedor</th><th class="n">Visitas</th>'+
      '<th class="n">PDV</th><th class="n">Alertas</th><th class="n">PM</th><th></th></tr></thead><tbody>';
    for(var q=0;q<arr.length;q++){
      var o3=arr[q], p=o3.prom;
      html+='<tr><td class="mini">'+(q+1)+'</td><td class="cod">'+esc(o3.v)+'</td>'+
        '<td class="n">'+o3.n+'</td><td class="n">'+Object.keys(o3.pdv).length+'</td>'+
        '<td class="n'+(o3.alertas?'':' mini')+'">'+o3.alertas+'</td>'+
        '<td class="n">'+(p===null?'<span class="mini">—</span>':'<span class="pill '+tono(p)+'">'+p+'%</span>')+'</td>'+
        '<td style="width:120px">'+(p===null?'':'<span class="track"><span class="fill" style="width:'+p+'%;background:var(--'+
          (p>=80?'green':(p>=50?'amber':'red'))+')"></span></span>')+'</td></tr>';
    }
    return sec('Ranking por vendedor', arr.length+' en el período', html+'</tbody></table>');
  }

  function evolucion(F){
    var por={};
    for(var i=0;i<F.length;i++){
      var p=cel(F[i],'Cod PDV'); if(!p) continue;
      (por[p]=por[p]||[]).push(F[i]);
    }
    var filas=[];
    for(var k in por){
      var vs=por[k];
      if(vs.length<2) continue;
      vs.sort(function(a,b){ return String(cel(a,'Fecha')).localeCompare(String(cel(b,'Fecha'))); });
      var pri=score(vs[0]), ult=score(vs[vs.length-1]);
      if(pri===null||ult===null) continue;
      filas.push({pdv:k, vend:cel(vs[vs.length-1],'Cod Vendedor'), n:vs.length,
                  f1:String(cel(vs[0],'Fecha')).slice(0,10),
                  f2:String(cel(vs[vs.length-1],'Fecha')).slice(0,10),
                  pri:pri, ult:ult, d:ult-pri});
    }
    filas.sort(function(a,b){ return a.d-b.d; });
    if(!filas.length){
      return sec('Evolución por PDV','',
        '<div class="vacio">Todavía no hay PDV con más de una visita.<br>'+
        'La comparación aparece cuando vuelvas a relevar un mismo punto de venta.</div>');
    }
    var mejor=0, peor=0;
    for(var m=0;m<filas.length;m++){ if(filas[m].d>0) mejor++; else if(filas[m].d<0) peor++; }
    var html='<table><thead><tr><th>PDV</th><th>Vendedor</th><th class="n">Visitas</th>'+
      '<th class="n">Primera</th><th class="n">Última</th><th class="n">Variación</th></tr></thead><tbody>';
    for(var q=0;q<filas.length;q++){
      var x=filas[q];
      var cls = x.d>0?'up':(x.d<0?'dn':'eq');
      var sig = x.d>0?'▲ +':(x.d<0?'▼ ':'– ');
      html+='<tr><td class="cod">'+esc(x.pdv)+'</td><td class="mini">'+esc(x.vend)+'</td>'+
        '<td class="n mini">'+x.n+'</td>'+
        '<td class="n"><span class="pill '+tono(x.pri)+'">'+x.pri+'%</span><br><span class="mini">'+esc(x.f1)+'</span></td>'+
        '<td class="n"><span class="pill '+tono(x.ult)+'">'+x.ult+'%</span><br><span class="mini">'+esc(x.f2)+'</span></td>'+
        '<td class="n"><span class="delta '+cls+'">'+sig+(x.d===0?'':Math.abs(x.d)+' pts')+'</span></td></tr>';
    }
    return sec('Evolución por PDV', mejor+' mejoraron · '+peor+' empeoraron', html+'</tbody></table>');
  }

  /* ================= MOTOR DE ACCIONES ================= */
  function acciones(F){
    var A=[];
    for(var i=0;i<F.length;i++){
      var r=F[i], pdv=txt(r,'Cod PDV'), vend=txt(r,'Cod Vendedor');
      var fech=String(cel(r,'Fecha')||'').slice(0,10);
      var ref=pdv+(vend?' · '+vend:'');
      var meta={pdv:pdv, vend:vend, fecha:fech};

      if(si(txt(r,'Productos vencidos'))){
        A.push({meta:meta, prio:1, nivel:'PDV', quien:ref, titulo:'Retirar producto vencido',
          porque:'Producto vencido o próximo a vencer'+(txt(r,'Detalle vencidos')?': '+txt(r,'Detalle vencidos'):'.'),
          comos:['Retirar de góndola y heladera en la próxima visita',
                 'Registrar el canje con el comerciante',
                 'Revisar la frecuencia de reposición del SKU']});
      }
      var pg=txt(r,'Planograma Gondola');
      if(pg==='No'||pg==='Parcial'){
        A.push({meta:meta, prio: pg==='No'?1:2, nivel:'PDV', quien:ref, titulo:'Reordenar góndola según planograma',
          porque:'Cumplimiento '+(pg==='No'?'nulo':'parcial')+' en góndola'+
                 (txt(r,'Coment. planograma gondola')?': '+txt(r,'Coment. planograma gondola'):'.'),
          comos:['Rearmar el bloque en la próxima visita del vendedor',
                 'Sacar foto del antes y el después',
                 'Dejar el planograma impreso en el local']});
      }
      var pe=txt(r,'Planograma EDF');
      if(pe==='No'||pe==='Parcial'){
        A.push({meta:meta, prio: pe==='No'?1:2, nivel:'PDV', quien:ref, titulo:'Reordenar el frío según planograma',
          porque:'Cumplimiento '+(pe==='No'?'nulo':'parcial')+' en EDF'+
                 (txt(r,'Coment. planograma EDF')?': '+txt(r,'Coment. planograma EDF'):'.'),
          comos:['Rearmar la heladera respetando el planograma',
                 'Verificar que los focos estén en frío']});
      }
      var pop=txt(r,'Estado material POP');
      if(pop==='Malo'||pop==='Regular'){
        A.push({meta:meta, prio: pop==='Malo'?2:3, nivel:'PDV', quien:ref, titulo:'Reponer material POP',
          porque:'Material POP en estado '+pop.toLowerCase()+
                 (txt(r,'Coment. exhibicion')?': '+txt(r,'Coment. exhibicion'):'.'),
          comos:['Cargar el pedido de POP para este PDV','Instalarlo en la próxima visita']});
      }
      if(si(txt(r,'Posibilidad heladera'))){
        A.push({meta:meta, prio:2, nivel:'PDV', quien:ref, titulo:'Gestionar colocación de heladera',
          porque:'Hay lugar para un equipo de frío'+(txt(r,'Detalle heladera')?': '+txt(r,'Detalle heladera'):'.'),
          comos:['Elevar la solicitud de EDF','Confirmar el espacio y el punto de luz',
                 'Acordar el compromiso de exhibición con el comerciante']});
      }
      if(si(txt(r,'Espacio ampliar exhibicion'))){
        A.push({meta:meta, prio:3, nivel:'PDV', quien:ref, titulo:'Ampliar exhibición',
          porque:'Hay espacio disponible'+(txt(r,'Detalle espacio')?': '+txt(r,'Detalle espacio'):'.'),
          comos:['Negociar el espacio adicional','Cargar el material de exhibición necesario']});
      }
      if(txt(r,'Ejecucion competencia')){
        A.push({meta:meta, prio:2, nivel:'PDV', quien:ref, titulo:'Responder a la ejecución de la competencia',
          porque:txt(r,'Ejecucion competencia'),
          comos:['Evaluar una contra-ejecución en el mismo espacio',
                 'Informar al área comercial si se repite en la zona']});
      }
      var falt=[];
      for(var k=0;k<FOCOS.length;k++){
        var v=txt(r,FOCOS[k][0]);
        if(v && !si(v)) falt.push(FOCOS[k][1]);
      }
      if(falt.length>=3){
        A.push({meta:meta, prio:2, nivel:'PDV', quien:ref, titulo:'Recuperar focos ausentes',
          porque:'Faltan '+falt.length+' de '+FOCOS.length+' focos: '+falt.join(', ')+'.',
          comos:['Incluir los focos faltantes en el próximo pedido',
                 'Verificar que haya espacio en frío y en góndola']});
      }
      var sc=score(r);
      if(sc!==null && sc<50){
        A.push({meta:meta, prio:1, nivel:'PDV', quien:ref, titulo:'Plan de recuperación del PDV',
          porque:'Programa de Mercado en '+sc+'%, por debajo del mínimo.',
          comos:['Armar visita conjunta con el vendedor',
                 'Definir los dos criterios más fáciles de recuperar primero',
                 'Volver a medir en la próxima visita']});
      }
      var prob=txt(r,'Problemas detectados');
      if(prob){
        A.push({meta:meta, prio:2, nivel:'PDV', quien:ref, titulo:'Resolver problema detectado en la visita',
          porque:prob, comos:['Verificar la resolución en la próxima visita']});
      }
      var quej=txt(r,'Comentarios del comerciante');
      if(quej){
        A.push({meta:meta, prio:3, nivel:'PDV', quien:ref, titulo:'Responder al comerciante',
          porque:quej,
          comos:['Dar respuesta o derivar al área que corresponda',
                 'Comunicar la respuesta en la próxima visita']});
      }
    }

    var porVend={}, totalEval={}, totalFail={};
    for(var i2=0;i2<F.length;i2++){
      var rr=F[i2], vv=txt(rr,'Cod Vendedor')||'(sin vendedor)';
      porVend[vv]=porVend[vv]||{n:0, fallas:{}};
      porVend[vv].n++;
      var crit=PM.concat(FOCOS);
      for(var c=0;c<crit.length;c++){
        var col=crit[c][0], nom=crit[c][1], val=txt(rr,col);
        if(!val) continue;
        totalEval[nom]=(totalEval[nom]||0)+1;
        if(!si(val)){
          totalFail[nom]=(totalFail[nom]||0)+1;
          porVend[vv].fallas[nom]=(porVend[vv].fallas[nom]||0)+1;
        }
      }
    }
    for(var nom2 in totalEval){
      var ev=totalEval[nom2], fa=totalFail[nom2]||0;
      if(ev>=4 && fa/ev>=0.6){
        A.push({prio:1, nivel:'Territorio', quien:'Todo el territorio',
          titulo:'Falla generalizada: '+nom2,
          porque:'Incumple en '+fa+' de '+ev+' PDV relevados ('+Math.round(fa/ev*100)+'%). No es un problema de un vendedor puntual.',
          comos:['Revisar si el criterio es alcanzable con el material disponible',
                 'Bajar el foco en la reunión de equipo',
                 'Definir un plazo de recuperación y volver a medir']});
      }
    }
    for(var vd in porVend){
      var info=porVend[vd];
      if(info.n<3) continue;
      for(var f2 in info.fallas){
        var pct=info.fallas[f2]/info.n;
        var pctTerr = totalEval[f2] ? (totalFail[f2]||0)/totalEval[f2] : 0;
        if(pct>=0.6 && pctTerr<0.6){
          A.push({prio:2, nivel:'Vendedor', quien:vd,
            titulo:'Trabajar '+f2+' con '+vd,
            porque:'Falla en '+info.fallas[f2]+' de sus '+info.n+' PDV, muy por encima del promedio del territorio.',
            comos:['Repasar el criterio en la reunión semanal',
                   'Acompañar una visita para mostrar la ejecución esperada']});
        }
      }
    }

    var agrup={};
    for(var a=0;a<A.length;a++){
      var x=A[a], key=x.nivel+'|'+x.titulo;
      if(x.nivel==='PDV'){
        if(!agrup[key]) agrup[key]={prio:x.prio, nivel:x.nivel, titulo:x.titulo, comos:x.comos, casos:[]};
        agrup[key].casos.push({quien:x.quien, porque:x.porque, meta:x.meta});
        agrup[key].prio=Math.min(agrup[key].prio,x.prio);
      } else {
        agrup[key+'|'+x.quien]={prio:x.prio, nivel:x.nivel, titulo:x.titulo, comos:x.comos,
                                casos:[{quien:x.quien, porque:x.porque}]};
      }
    }
    var lista=[];
    for(var g in agrup) lista.push(agrup[g]);
    lista.sort(function(a,b){
      if(a.prio!==b.prio) return a.prio-b.prio;
      return b.casos.length-a.casos.length;
    });
    return lista;
  }

  if(url()){ $('url').value=url(); cargar(true); }
})();
</script>
